<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SenpaiNet｜ISS生向け相談プラットフォーム</title>
<link rel="icon" type="image/png" href="assets/logo/app-icon.png">
<link rel="apple-touch-icon" href="assets/logo/app-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f4f8ff;font-family:'Zen Kaku Gothic New',sans-serif;color:#1b2942;-webkit-font-smoothing:antialiased}
  input,textarea,select,button{font-family:inherit}
  textarea{resize:none}
  ::placeholder{color:#aab4c2}
  .num{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800}
  /* hover states (ported from style-hover in the design) */
  .card-hover{transition:box-shadow .15s,border-color .15s}
  .card-hover:hover{box-shadow:0 8px 22px rgba(15,23,42,.08);border-color:#cfe0fb}
  .row-hover{transition:box-shadow .15s,border-color .15s}
  .row-hover:hover{box-shadow:0 6px 18px rgba(15,23,42,.06);border-color:#cfe0fb}

  /* ボタン共通のホバー：少し浮かせて影をつける。色は各ボタンの指定を活かすため
     brightness で軽く持ち上げるだけにして、個別のインラインstyleと衝突させない。 */
  button, [data-auth], [data-nav], [data-chip], [data-ptag], [data-mp-tag],
  [data-edit-tag], [data-report-reason], [data-setup-tag]{
    transition: transform .14s ease, box-shadow .14s ease, filter .14s ease, background .14s ease, border-color .14s ease;
  }
  button:hover:not(:disabled){ transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15,23,42,.13); filter: brightness(1.06); }
  button:active:not(:disabled){ transform: translateY(0); box-shadow: 0 1px 3px rgba(15,23,42,.14); filter: brightness(.97); }
  button:disabled{ cursor: not-allowed; opacity: .6 }

  /* ボタン以外のクリックできる要素（span や div で作られているもの） */
  [data-auth]:hover, [data-chip]:hover, [data-ptag]:hover, [data-mp-tag]:hover,
  [data-edit-tag]:hover, [data-report-reason]:hover, [data-setup-tag]:hover{
    transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15,23,42,.10); filter: brightness(1.04);
  }
  [data-auth]:active, [data-chip]:active, [data-ptag]:active, [data-mp-tag]:active,
  [data-edit-tag]:active, [data-report-reason]:active, [data-setup-tag]:active{ transform: translateY(0) }

  /* ナビ・テキストリンク系は浮かせず、色の変化だけにする */
  [data-nav]:not(.nav-link):not(.nav-row):hover{ filter: brightness(1.1) }

  /* ヘッダーのナビ：下線が伸びて色が変わる。インラインstyleを上書きするため
     !important を使っている（各項目の色・下線は描画時に直接指定されているため） */
  .nav-link{ position: relative; transition: color .18s ease }
  .nav-link::after{
    content: ""; position: absolute; left: 50%; right: 50%; bottom: -2px; height: 2px;
    background: #2f73e8; border-radius: 2px; transition: left .22s ease, right .22s ease;
  }
  .nav-link:hover{ color: #2f73e8 !important }
  .nav-link:hover::after{ left: 0; right: 0 }
  /* 選択中の項目は最初から下線が引かれているので、::after は出さない */
  .nav-link-on::after{ content: none }
  .nav-link:focus-visible{ outline: 2px solid #2f73e8; outline-offset: 3px; border-radius: 3px }

  /* モバイルメニューの各行：背景を敷いて矢印を右に送る */
  .nav-row{ transition: background .16s ease, padding-left .16s ease }
  .nav-row:hover{ background: #f2f7fd; padding-left: 10px !important; color: #2f73e8 !important }
  .nav-row-chev{ transition: transform .16s ease, color .16s ease; display: inline-block }
  .nav-row:hover .nav-row-chev{ transform: translateX(3px); color: #2f73e8 }

  /* キーボード操作でも位置が分かるように */
  button:focus-visible, [data-auth]:focus-visible, [data-ptag]:focus-visible,
  [data-mp-tag]:focus-visible, [data-chip]:focus-visible{
    outline: 2px solid #2f73e8; outline-offset: 2px;
  }

  @media (prefers-reduced-motion:reduce){
    button, [data-auth], [data-nav], [data-chip], [data-ptag], [data-mp-tag],
    [data-edit-tag], [data-report-reason], [data-setup-tag]{ transition: none }
    button:hover:not(:disabled), [data-auth]:hover, [data-chip]:hover, [data-ptag]:hover,
    [data-mp-tag]:hover, [data-edit-tag]:hover, [data-report-reason]:hover, [data-setup-tag]:hover{
      transform: none;
    }
    .nav-link, .nav-link::after, .nav-row, .nav-row-chev{ transition: none }
    .nav-row:hover{ padding-left: 4px !important }
    .nav-row:hover .nav-row-chev{ transform: none }
  }

  /* ===== Responsive ===== */
  .rs-burger{display:none}
  .rs-mobile-menu{display:none}
  img,svg{max-width:100%}

  /* Tablet / small-desktop: collapse nav to hamburger, stack 2-col layouts */
  @media (max-width:880px){
    .rs-nav{display:none !important}
    .rs-actions{display:none !important}
    .rs-burger{display:flex !important}
    .rs-mobile-menu{display:block}
    .rs-hero{grid-template-columns:1fr !important; gap:30px !important; padding-top:34px !important}
    .rs-hero-h1{font-size:34px !important}
    .rs-stats{grid-template-columns:repeat(2,1fr) !important; row-gap:22px}
    .rs-stat{border-right:none !important}
    .rs-pop{grid-template-columns:1fr !important}
    .rs-post{grid-template-columns:1fr !important}
    .rs-mypage{grid-template-columns:1fr !important}
    .rs-footer{grid-template-columns:1fr 1fr !important; gap:22px !important}
  }

  /* Phones: single-column everywhere, tighter gutters, smaller type */
  @media (max-width:560px){
    .rs-pad{padding-left:16px !important; padding-right:16px !important}
    .rs-hero-h1{font-size:27px !important}
    .rs-stats{grid-template-columns:1fr !important}
    .rs-footer{grid-template-columns:1fr !important}
    .rs-search{flex-wrap:wrap}
    .rs-search-sort{flex:1; justify-content:center}
    .rs-page-h1{font-size:22px !important}
    .rs-stack-sm{flex-direction:column !important; align-items:stretch !important; gap:14px !important}
    .rs-stack-sm > button{align-self:flex-start}
    .rs-btn-row{flex-wrap:wrap}
  }

  @media (max-width:560px){ .sp-grid{grid-template-columns:1fr !important} }

  /* community dashboard */
  .cm-card{transition:box-shadow .18s,transform .18s,border-color .18s}
  .cm-card:hover{box-shadow:0 14px 30px rgba(15,23,42,.10);border-color:#cfe0fb;transform:translateY(-2px)}
  .cm-cat-card{transition:box-shadow .18s,transform .18s,border-color .18s;scroll-snap-align:start}
  .cm-cat-card:hover{box-shadow:0 10px 22px rgba(15,23,42,.08);border-color:#cfe0fb;transform:translateY(-2px)}
  .cm-carousel{scrollbar-width:none}
  .cm-carousel::-webkit-scrollbar{display:none}
  .cm-side-item{transition:background .15s}
  .cm-side-item:hover{background:#f2f6fc}
  .cm-feed-card{transition:box-shadow .15s,border-color .15s}
  .cm-feed-card:hover{box-shadow:0 8px 20px rgba(15,23,42,.06);border-color:#dde4f1}
  .cm-dash-grid{display:grid;grid-template-columns:220px minmax(0,1fr) 260px;gap:22px;align-items:start}
  @media (max-width:1080px){ .cm-dash-grid{grid-template-columns:1fr} .cm-dash-side{display:none} }

  /* admin login spinner */
  .sn-spin{width:38px;height:38px;border-radius:50%;border:4px solid #dbe7fb;border-top-color:#2f73e8;animation:sn-rot .8s linear infinite}
  @keyframes sn-rot{to{transform:rotate(360deg)}}

  /* admin console v2 */
  .admin2-body{display:flex;flex:1;min-height:0}
  .admin2-side{width:250px;flex-shrink:0;background:#0f1c33;display:flex;flex-direction:column}
  .admin2-main{flex:1;min-width:0;padding:26px 30px 50px;background:#f1f4f9}
  .admin2-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .admin2-charts{display:grid;grid-template-columns:1.5fr 1.15fr .95fr;gap:18px;align-items:start}
  .admin2-lower{display:grid;grid-template-columns:1.7fr 1fr;gap:18px;align-items:start}
  @media (max-width:1200px){ .admin2-charts{grid-template-columns:1fr 1fr} .admin2-charts>div:first-child{grid-column:1 / -1} }
  @media (max-width:1100px){ .admin2-kpis{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:1000px){ .admin2-lower{grid-template-columns:1fr} }
  @media (max-width:900px){ .admin2-charts{grid-template-columns:1fr} .admin2-charts>div:first-child{grid-column:auto} }
  @media (max-width:860px){ .admin2-body{flex-direction:column} .admin2-side{width:auto;flex-direction:row;overflow-x:auto} .admin2-side .a2-group{display:none} .admin2-side .a2-foot{display:none} .admin2-side>div{display:flex} }

  /* admin console */
  .admin-grid{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
  .admin-cols{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}
  /* 相談管理：一覧＋プレビュー（管理画面内で切り替え） */
  .admin-split{display:grid;grid-template-columns:1fr 1.2fr;gap:18px;align-items:start}
  @media (max-width:1100px){ .admin-split{grid-template-columns:1fr} }
  @media (max-width:1000px){ .admin-cols{grid-template-columns:1fr} }
  @media (max-width:820px){
    .admin-grid{grid-template-columns:1fr}
    .admin-side{flex-direction:row !important;align-items:center;overflow-x:auto;gap:6px !important;padding:12px 14px !important}
    .admin-side .adm-logo{padding:6px 10px 6px 4px !important}
    .admin-side .adm-back{margin-top:0 !important}
    .admin-side>div[data-admin-tab]{white-space:nowrap}
  }

  /* consultation detail (相談内容) */
  .detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
  @media (max-width:960px){ .detail-grid{grid-template-columns:1fr} .detail-side{position:static !important} }
  .rel-item{transition:background .14s}
  .rel-item:hover{background:#f5f8ff}

  /* news (お知らせ) dashboard */
  .news-grid{display:grid;grid-template-columns:248px minmax(0,1fr) 300px;gap:24px;align-items:start}
  @media (max-width:1120px){ .news-grid{grid-template-columns:1fr} .news-side{display:none} }
  /* 先輩からのお知らせ (prominent) */
  .senpai-card{transition:box-shadow .15s,transform .15s,border-color .15s}
  .senpai-card:hover{box-shadow:0 8px 20px rgba(47,115,232,.12);transform:translateY(-1px);border-color:#c3daf7}
  @media (max-width:520px){ .senpai-row{flex-wrap:wrap} .senpai-row>button{width:100%;margin-top:4px} }
  /* イラスト素材（1枚のシートをCSSスプライトで切り出し / 4列×3行） */
  .ill{background-image:url('assets/illustrations/illustration.png');background-size:400% 300%;background-repeat:no-repeat;aspect-ratio:384/341;mix-blend-mode:multiply}
  .ill-boy-laptop{background-position:0% 0%}
  .ill-girl-book{background-position:33.333% 0%}
  .ill-chat{background-position:66.667% 0%}
  .ill-cap{background-position:100% 0%}
  .ill-mail{background-position:0% 50%}
  .ill-check{background-position:33.333% 50%}
  .ill-growth{background-position:66.667% 50%}
  .ill-trophy{background-position:100% 50%}
  .ill-medal{background-position:0% 100%}
  .ill-highfive{background-position:33.333% 100%}
  .ill-plane{background-position:66.667% 100%}
  .ill-girl-phone{background-position:100% 100%}

  /* 私たちについて（About / LP） */
  .ab-split{display:grid;grid-template-columns:252px 1fr;gap:36px;align-items:start}
  .ab-c4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .ab-c3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .ab-flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:start}
  .ab-scroll{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 12px;scroll-behavior:smooth}
  /* 相談できる内容の例：自動で横に流れる（マーキー） */
  .ab-marquee{overflow:hidden;padding:4px 0 12px}
  .ab-marquee-track{display:flex;width:max-content;animation:ab-marq 45s linear infinite}
  .ab-marquee:hover .ab-marquee-track{animation-play-state:paused}
  @keyframes ab-marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion:reduce){ .ab-marquee{overflow-x:auto} .ab-marquee-track{animation:none} }
  .ab-need{display:flex;align-items:flex-start;justify-content:center;gap:6px;flex-wrap:wrap}
  .ab-whatrow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
  @media (max-width:760px){ .ab-need,.ab-whatrow{gap:16px} }
  .ab-card{background:#fff;border:1px solid #e7edf6;border-radius:16px;box-shadow:0 6px 18px rgba(15,23,42,.04)}
  @media (max-width:1000px){
    .ab-split{grid-template-columns:1fr;gap:20px}
    .ab-c4{grid-template-columns:repeat(2,1fr)}
    .ab-flow{grid-template-columns:1fr;gap:18px}
    .ab-flow .ab-arrow{display:none}
  }
  @media (max-width:640px){ .ab-c4,.ab-c3{grid-template-columns:1fr} }

  /* 写真背景セクション：狭い画面では写真を外して可読性を優先 */
  @media (max-width:1000px){
    .split-photo{background-image:none !important;background:linear-gradient(120deg,#eaf1ff 0%,#f4f8ff 55%,#fdf3ee 100%) !important}
  }

  /* ホームのセクション見出し内リンク */
  .sec-link{transition:background .15s,border-color .15s,box-shadow .15s}
  .sec-link:hover{background:#e8f1fe;border-color:#bcd3f5;box-shadow:0 4px 12px rgba(47,115,232,.12)}

  /* ご意見募集バナー（ホーム・全幅・青地／控えめサイズ） */
  .fb-sec{margin:44px 0 0}
  .fb-card{position:relative;overflow:hidden;background:linear-gradient(115deg,#1f4fd0 0%,#2f73e8 52%,#4d92ff 100%);padding:24px 28px}
  .fb-card::before{content:"";position:absolute;top:-90px;right:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,0) 70%)}
  .fb-inner{position:relative;z-index:1;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center}
  .fb-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:800}
  .fb-title{margin:11px 0 0;font-size:clamp(17px,2vw,21px);font-weight:900;line-height:1.5;color:#fff}
  .fb-title .blue{color:#ffe27a}
  .fb-hl{background:linear-gradient(transparent 62%,rgba(255,212,59,.8) 62%);padding:0 2px}
  .fb-sub{margin:8px 0 0;font-size:12.5px;line-height:1.8;color:#dbe7ff}
  .fb-btn{flex-shrink:0;display:inline-flex;align-items:center;gap:9px;cursor:pointer;border:none;background:#fff;color:#2f5fe0;font-weight:800;font-size:13.5px;padding:12px 22px;border-radius:11px;box-shadow:0 5px 14px rgba(10,25,60,.18);white-space:nowrap}
  .fb-btn .fb-arrow{transition:transform .18s ease}
  .fb-btn:hover .fb-arrow{transform:translateX(3px)}
  .fb-photo{display:none}
  @media (max-width:720px){
    .fb-card{padding:22px 22px}
    .fb-inner{grid-template-columns:1fr;gap:14px}
  }
  @media (prefers-reduced-motion:reduce){ .fb-btn:hover .fb-arrow{transform:none} }

  /* 使い方（howto）: 色帯の中に白い見出し板＋ステップカードを並べる */
  .howto-band{border-radius:22px;padding:32px 28px 34px;margin-bottom:22px}
  .howto-banner{position:relative;background:#fff;border-radius:10px;padding:17px 30px;text-align:center;max-width:720px;margin:0 auto 36px}
  .howto-banner::after{content:"";position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);
    border-left:15px solid transparent;border-right:15px solid transparent;border-top:15px solid #fff}
  .howto-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .howto-cards.c3{grid-template-columns:repeat(3,1fr)}
  .howto-card{background:#f7cf4a;border-radius:16px;padding:20px 18px 24px;
    display:grid;grid-template-columns:1fr;grid-template-areas:"pill" "title" "ill" "desc";
    justify-items:center;text-align:center;gap:0}
  .hc-pill{grid-area:pill;background:#14233f;color:#fff;font-size:11px;font-weight:800;letter-spacing:.1em;padding:6px 20px;border-radius:20px}
  .hc-title{grid-area:title;font-size:16px;font-weight:900;color:#2a2405;line-height:1.5;margin-top:14px}
  /* イラストは白地に multiply で重ねる前提の素材なので、白いパネルを敷いて
     isolation で合成範囲を閉じる（黄色のカードに直接置くと黄ばんで見えるため） */
  .hc-illbox{grid-area:ill;width:112px;background:#fff;border-radius:14px;padding:7px;margin:14px 0 4px;isolation:isolate}
  .hc-ill{width:100%}
  .hc-desc{grid-area:desc;font-size:12.5px;font-weight:700;color:#5c4f11;line-height:1.75;margin-top:8px}
  @media (max-width:900px){
    .howto-cards,.howto-cards.c3{grid-template-columns:1fr;gap:13px}
    .howto-card{grid-template-columns:1fr 92px;grid-template-areas:"pill ill" "title ill" "desc ill";
      justify-items:start;text-align:left;align-items:center;padding:16px 18px;column-gap:12px}
    .hc-title{font-size:14.5px;margin-top:9px}
    .hc-illbox{width:92px;margin:0;align-self:center;padding:6px}
    .hc-desc{font-size:11.5px;margin-top:5px}
    .howto-banner{padding:14px 20px;margin-bottom:30px}
  }
  .howto-safety{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
  @media (max-width:900px){ .howto-safety{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:560px){ .howto-safety{grid-template-columns:1fr} }
  .news-row{transition:background .15s}
  .news-row:hover{background:#f7faff}
  .nsw{width:38px;height:22px;border-radius:11px;position:relative;cursor:pointer;flex-shrink:0;transition:background .18s}
  .nsw i{position:absolute;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15);transition:left .18s}
  @media (max-width:560px){ .rs-hide-sm{display:none !important} }

  /* FAQ accordion */
  details.faq{border:1px solid #e7edf6;border-radius:12px;background:#fff;margin-bottom:10px;overflow:hidden}
  details.faq summary{cursor:pointer;padding:16px 18px;font-size:14.5px;font-weight:700;color:#1b2942;display:flex;justify-content:space-between;align-items:center;gap:12px;list-style:none}
  details.faq summary::-webkit-details-marker{display:none}
  details.faq summary .chev{flex-shrink:0;color:#94a1b5;transition:transform .18s}
  details.faq[open] summary{color:#1f5fd0}
  details.faq[open] summary .chev{transform:rotate(180deg)}
  details.faq .ans{padding:0 18px 16px;font-size:13.5px;color:#5a6678;line-height:1.85}

  /* scroll reveal (ホーム) */
  .reveal{opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.3,1)}
  .reveal.reveal-in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){ .reveal,.reveal.reveal-in{opacity:1 !important;transform:none !important;transition:none} }

  /* ===== Loading splash ===== */
  #splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#e6f1ff 0%,#f4f9ff 55%,#ffffff 100%);
    transition:opacity .55s ease, transform .55s ease}
  #splash.sp-hide{opacity:0;transform:scale(1.05);pointer-events:none}
  .sp-inner{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px}
  .sp-logowrap{position:relative;width:112px;height:112px;display:flex;align-items:center;justify-content:center;margin-bottom:22px}
  .sp-glow{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 45%,rgba(37,99,235,.22),rgba(37,99,235,0) 68%);
    animation:sp-pulse 1.8s ease-in-out infinite}
  .sp-logo{position:relative;width:88px;height:88px;object-fit:contain}
  .sp-cap{transform-origin:50% 50%;animation:sp-pop .8s cubic-bezier(.2,1.3,.4,1) both}
  .sp-band{stroke-dasharray:82;stroke-dashoffset:82;animation:sp-draw .7s .45s ease forwards}
  .sp-tassel{opacity:0;animation:sp-fade .4s .9s ease forwards}
  .sp-orbit{position:absolute;inset:0;animation:sp-orbit 2.4s linear infinite}
  .sp-orbit i{position:absolute;top:-3px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;
    background:#0ea5e9;box-shadow:0 0 10px rgba(14,165,233,.7)}
  .sp-word{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:30px;letter-spacing:-.02em;color:#1b2942;
    opacity:0;animation:sp-up .6s .55s ease forwards}
  .sp-word span{color:#2f73e8}

<script>
(function(){
"use strict";

/* ============ CATEGORY DEFINITIONS ============ */
var cats = {
  shinro:  { label: '進路・受験',    color: '#0ea5a9', bg: '#e1f6f7' },
  benkyo:  { label: '勉強・学習',    color: '#1e9e63', bg: '#e7f5ee' },

  ningen:  { label: '人間関係',      color: '#e0568a', bg: '#fde8f0' },
  career:  { label: '将来・キャリア', color: '#5b6ef0', bg: '#ebedfe' },
  other:   { label: 'その他',        color: '#6b7280', bg: '#eef1f6' }
};

/* ============ SCHOOL / 回生 ENGINE ============ */
// 単一校（中高一貫・6年制）向け。20回生が2026年度に中1（1年生）。
// 学年と「在校生／卒業生」は現在の年度から自動計算され、毎年度くり上がる（＝毎年更新）。
var SCHOOL = { name: '〇〇中学・高等学校', baseKaisei: 20, baseYear: 2026 };
var GRADE_LABELS = { 1:'中1', 2:'中2', 3:'中3', 4:'高1', 5:'高2', 6:'高3' };
// 相談のハッシュタグ／卒業生が「答えられる分野」として選ぶタグ（共通の語彙）
var HASHTAGS = ['受験・進路','大学生活','勉強法','文系','理系','医療・看護','海外・留学','部活・課外活動','就活・インターン','人間関係','一人暮らし','資格・語学'];
// 年度（4月始まり）。3月までは前年度扱い。
function schoolYear(d){ d = d || new Date(); return d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1; }
// baseYear年度に baseKaisei回生 が1年生（中1）。回生が小さいほど上級生。
function gradeOf(kaisei, y){ if(y==null) y = schoolYear(); return 1 + (SCHOOL.baseKaisei - kaisei) + (y - SCHOOL.baseYear); }
function statusOf(kaisei, y){
  var g = gradeOf(kaisei, y);
  if(g < 1)  return { type:'future', grade:g };
  if(g <= 6) return { type:'current', grade:g, gradeLabel:GRADE_LABELS[g] };
  return { type:'grad', grade:g, years:g - 6 };
}
// 表示名: 在校生→「18回生（中3）」, 卒業生→「14回生（卒業生）」
function personName(kaisei, y){
  var s = statusOf(kaisei, y);
  if(s.type==='current') return kaisei + '回生（' + s.gradeLabel + '）';
  if(s.type==='grad')    return kaisei + '回生（卒業生）';
  return kaisei + '回生';
}
// サブ情報: 卒業生→「卒業N年目」, 在校生→学年ラベル
function personMeta(kaisei, y){
  var s = statusOf(kaisei, y);
  if(s.type==='grad')    return '卒業' + s.years + '年目';
  if(s.type==='current') return s.gradeLabel;
  return '';
}
// バッジ: 在校生／卒業生 を色分け
function personBadge(kaisei, y){
  var s = statusOf(kaisei, y);
  if(s.type==='grad') return { label:'卒業生', color:'#1f5fd0', bg:'#e8f1fe' };
  return { label:'在校生', color:'#0ea5a9', bg:'#d9f3ee' };
}
// 今年度に中1（1年生）の回生、学年→回生の逆算
function currentChu1Kaisei(){ return SCHOOL.baseKaisei + (schoolYear() - SCHOOL.baseYear); }
function kaiseiFromGrade(g){ return currentChu1Kaisei() - (g - 1); }

/* ============ STATE ============ */
var state = {
  screen: 'home', query: '', activeCat: 'all', activeGrade: 'all', selectedId: null,
  pstep: 1, pcat: '', ptitle: '', pbody: '', pMoreOpen: false, pContext: '', pTags: [],
  // 卒業生登録：得意分野タグ・通知先メール・メール通知の希望
  setupTags: [], setupEmail: '', setupNotify: true,
  answering: false, answerText: '', answerAnon: false,
  myAnswerIds: {}, myAnswers: {}, answerEditIdx: null, answerEditText: '',
  replyTo: null, replyText: '',
  browseSort: 'new', browseLimit: 4, answerSort: 'new',
  userName: '在校生ユーザー', userKaisei: 18, userUniv: '', userFaculty: '', userTags: [], menuOpen: false, loggedIn: false, pendingSignIn: false, mypageTab: 'overview',
  setupStatus: null, setupGrade: null, setupGradKaisei: null, setupUniv: '', setupFaculty: '', setupNick: '',
  communityGroup: null, communityText: '',
  communityFilter: 'all', communityFeedTab: 'all', communitySort: 'popular', followedUsers: {},
  outreachFilter: 'all',
  outreachPosts: [],
  communityPosts: [],
  communityUsers: [],
  // ---- 運営（管理者）コンソール ----
  adminTab: 'dashboard', adminSelectedId: null, adminReportId: null,
  reportTarget: null, reportReason: '', reportNote: '', adminReportsLoaded: false,
  reportActionReason: '', reportModAction: null, reportModId: null,
  editTarget: null, editTitle: '', editBody: '', editTags: [],
  adminNewTag: '', adminEditTag: null, adminEditTagText: '',

  adminContacts: [], adminContactId: null, adminContactsLoaded: false,
  mpTags: null, mpEmail: '', mpNotify: true, mpProfileLoaded: false,
  adminMembers: [], adminMembersLoaded: false, adminMembersLoading: false, adminMembersError: false, adminNewEmail: '', adminNewName: '',
  // Firebase 認証（Googleログイン＋招待制の許可リスト）
  authReady: false, authConfigured: false, authUser: null, adminAuthorized: false,
  adminUsers: [],

  newsPrefs: { ops:true, event:true, campaign:false, maint:true },
  newsItems: [],
  newsSchedule: [],
  // 先輩（卒業生）からのお知らせ・宣伝。お知らせページで最も目立つ位置に表示。
  senpaiNews: [],
  notifications: [],
  consultations: [],
  myPosts: []
};

// ホーム実績を実データから自動集計（投稿・回答が増えるたびに反映）
function computeStats(){
  var cs = state.consultations;
  var total = cs.length;
  var answered = cs.filter(function(c){ return c.answers.length > 0; }).length;
  var rate = total ? Math.round(answered / total * 100) : 0;
  var replied = cs.filter(function(c){ return c.firstReplyHours != null; });
  var avg = replied.length ? replied.reduce(function(s,c){ return s + c.firstReplyHours; }, 0) / replied.length : 0;
  // 回答に参加した先輩（回生）のユニーク数。ログイン中の卒業生本人も加える。
  var set = {};
  cs.forEach(function(c){ c.answers.forEach(function(a){ if(a.kaisei != null) set[a.kaisei] = 1; }); });
  if(state.loggedIn && statusOf(state.userKaisei).type==='grad') set[state.userKaisei] = 1;
  var senpai = Object.keys(set).length;
  return { total: total, rate: rate, avgHours: avg, senpai: senpai };
}

/* ============ HELPERS ============ */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function find(id){ for(var i=0;i<state.consultations.length;i++){ if(state.consultations[i].id===id) return state.consultations[i]; } return null; }
function selectedC(){ return find(state.selectedId); }
function findNotif(id){ for(var i=0;i<state.notifications.length;i++){ if(state.notifications[i].id===id) return state.notifications[i]; } return null; }
// 自分の投稿記録（myPosts / myAnswers）と公開データから通知を組み立てる。
// 匿名性を保つため、他人のアクションを直接受け取るのではなく「自分の投稿への反応」を検出する。
function computeNotifications(){
  if(!state.loggedIn){ state.notifications = []; return; }
  var list = [];
  // 自分の相談への新着回答
  (state.myPosts || []).forEach(function(p){
    var c = find(p.cid); if(!c) return;
    var total = (c.answers || []).length;
    var seen = p.seenAnswers || 0;
    if(total > seen){
      list.push({ id:'na_'+p.cid, cid:p.cid,
        title:'新しい回答が届きました',
        body:'「'+(c.title || p.title || '相談')+'」に'+(total - seen)+'件の回答が届きました。',
        time:(c.answers[0] && c.answers[0].time) || '', unread:true, _sort:(c.postedAt||0) });
    }
  });
  // 自分の回答への新着返信
  Object.keys(state.myAnswers || {}).forEach(function(aid){
    var meta = state.myAnswers[aid]; if(!meta || !meta.cid) return;
    var c = find(meta.cid); if(!c) return;
    var ans = (c.answers || []).filter(function(a){ return a.id === aid; })[0]; if(!ans) return;
    var total = (ans.replies || []).length;
    var seen = meta.seenReplies || 0;
    if(total > seen){
      list.push({ id:'nr_'+aid, cid:meta.cid,
        title:'あなたの回答に返信がありました',
        body:'「'+(c.title || '相談')+'」のあなたの回答に'+(total - seen)+'件の返信がつきました。',
        time:'', unread:true, _sort:(meta.createdAt||0) });
    }
  });
  list.sort(function(a,b){ return (b._sort||0) - (a._sort||0); });
  state.notifications = list;
}
// 通知1件を確認済みにする（既読カウントを更新して保存）
function markNotifSeen(n){
  if(!n) return;
  if(n.id.indexOf('na_') === 0){
    var p = (state.myPosts || []).filter(function(x){ return x.cid === n.cid; })[0];
    var c = find(n.cid);
    if(p && c){ p.seenAnswers = (c.answers || []).length;
      if(state.authUser && state.authUser.uid && window.snDb && window.snDb.addMyPost) window.snDb.addMyPost(state.authUser.uid, p.cid, p); }
  } else if(n.id.indexOf('nr_') === 0){
    var aid = n.id.slice(3);
    var meta = state.myAnswers[aid]; var c2 = find(n.cid);
    var ans = c2 ? (c2.answers || []).filter(function(a){ return a.id === aid; })[0] : null;
    if(meta && ans){ meta.seenReplies = (ans.replies || []).length;
      if(state.authUser && state.authUser.uid && window.snDb && window.snDb.addMyAnswer) window.snDb.addMyAnswer(state.authUser.uid, aid, meta); }
  }
  computeNotifications();
}
// すべての通知を確認済みにする
function markAllNotifsSeen(){
  (state.myPosts || []).forEach(function(p){ var c = find(p.cid); if(c){ p.seenAnswers = (c.answers||[]).length;
    if(state.authUser && state.authUser.uid && window.snDb && window.snDb.addMyPost) window.snDb.addMyPost(state.authUser.uid, p.cid, p); } });
  Object.keys(state.myAnswers || {}).forEach(function(aid){ var meta = state.myAnswers[aid]; var c = find(meta && meta.cid);
    var ans = c ? (c.answers||[]).filter(function(a){ return a.id===aid; })[0] : null;
    if(meta && ans){ meta.seenReplies = (ans.replies||[]).length;
      if(state.authUser && state.authUser.uid && window.snDb && window.snDb.addMyAnswer) window.snDb.addMyAnswer(state.authUser.uid, aid, meta); } });
  computeNotifications();
}

// Convert a relative-time label ("30分前" / "2時間前" / "1日前" / "たった今") to
// minutes-ago, so "新しい順" can sort by recency. Smaller = newer.
function timeRank(str){
  if(!str) return 1e9;
  if(str.indexOf('たった今')!==-1) return 0;
  var m = str.match(/(\d+)/); var n = m? parseInt(m[1],10) : 0;
  if(str.indexOf('日')!==-1) return n*1440;
  if(str.indexOf('時間')!==-1) return n*60;
  if(str.indexOf('分')!==-1) return n;
  return 1e9;
}

/* ---- Toast ---- */

  setTimeout(function(){ t.style.opacity='0'; t.style.transform='translateY(8px)'; setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 220); }, 2200);
}

    var em = (state.setupEmail||'').trim();
    if(window.snDb && window.snDb.saveSenpaiProfile && state.setupTags.length && em){

function submitAnswer(){
  var c=selectedC(); var t=state.answerText.trim();
  if(!c||!t) return;
  var wasEmpty = c.answers.length === 0;
  var localAns = { kaisei:state.userKaisei, time:'たった今', body:t, helpful:0, marked:false, you:true, anon:!!state.answerAnon, replies:[] };
  c.answers.unshift(localAns);
  c.nAnswers += 1;
  // Firestore に保存（全員に共有）。未設定/失敗時はローカルのみ。
  // 返信をひも付けられるよう、生成されたIDをローカルの回答にも持たせる。
  if(window.snDb && window.snDb.addAnswer){
    var pr = window.snDb.addAnswer(c.id, { kaisei:state.userKaisei, time:'たった今', body:t, helpful:0, anon:!!state.answerAnon, createdAt:Date.now() });
    if(pr && pr.then) pr.then(function(id){
      if(!id) return;
      localAns.id = id;
      // あとから本人が編集・削除できるよう、所有者を記録する（回答本体は匿名のまま）
      if(state.authUser && state.authUser.uid){
        state.myAnswerIds[id] = true;
        // 自分の回答として記録（返信の通知に seenReplies を使う）
        var meta = { cid:c.id, seenReplies:(localAns.replies||[]).length, createdAt:Date.now() };
        state.myAnswers[id] = meta;
        if(window.snDb.addAnswerOwner) window.snDb.addAnswerOwner(id, state.authUser.uid, c.id);
        if(window.snDb.addMyAnswer) window.snDb.addMyAnswer(state.authUser.uid, id, meta);
      }
    });
  }
  // 初回回答なら「返信までの時間」を記録（→ 回答率・平均返信時間に反映）
  if(wasEmpty && c.firstReplyHours == null){
    var hrs = (Date.now() - (c.postedAt || Date.now())) / 3600000;
    c.firstReplyHours = Math.max(0.1, Math.round(hrs * 10) / 10);
  }
  state.answering=false; state.answerText=''; state.answerAnon=false;
  render(); toast('回答を投稿しました');
}
// 回答への返信を投稿（Firestore: consultations/{cid}/answers/{aid}/replies）
function submitReply(){
  var c = selectedC(); if(!c) return;
  var a = c.answers[state.replyTo];
  var t = (state.replyText||'').trim();
  if(!a || !t) return;
  if(!Array.isArray(a.replies)) a.replies = [];
  a.replies.push({ kaisei:state.userKaisei, time:'たった今', body:t, you:true });
  if(window.snDb && window.snDb.addReply && a.id){
    window.snDb.addReply(c.id, a.id, { kaisei:state.userKaisei, time:'たった今', body:t, createdAt:Date.now() });
  }
  state.replyTo = null; state.replyText = '';
  render(); toast('返信しました');
}

function addUserConsultation(){
  // 画面を経由せず呼ばれた場合の保険（未ログインでは投稿させない）
  if(!state.loggedIn){ go('post'); toast('相談するには登録が必要です'); return false; }

    answers:[]
  });
  // cid でマイページの「自分の相談」から相談ページを開けるようにする
  state.myPosts.unshift({ cid:id, category:state.pcat, title:state.ptitle.trim(), nAnswers:0, time:'たった今', status:'回答受付中' });
  // ログイン中なら自分のアカウント配下にも記録（相談本体は匿名のまま＝uidは持たせない）
  if(state.authUser && state.authUser.uid && window.snDb && window.snDb.addMyPost){
    window.snDb.addMyPost(state.authUser.uid, id, { title:state.ptitle.trim(), category:state.pcat, status:'回答受付中', nAnswers:0, time:'たった今', createdAt:Date.now() });
    // あとから本人が編集・削除できるように、所有者を別コレクションに記録する
    if(window.snDb.addConsultationOwner) window.snDb.addConsultationOwner(id, state.authUser.uid);
  }
  // Firestore に保存（全員に反映）。未設定/失敗時はローカルのみ。
  if(window.snDb && window.snDb.addConsultation) window.snDb.addConsultation(state.consultations[0]);
  // タグが付いていれば、該当分野の先輩への通知をキューに積む
  // （実際のメール送信はサーバー側＝Cloud Functions が担当。メールアドレスは
  //   プライバシー保護のためクライアントからは読み取らない設計）
  if(tags.length && window.snDb && window.snDb.enqueueNotify){
    window.snDb.enqueueNotify({
      consultationId: id,
      title: state.ptitle.trim(),
      excerpt: (state.pbody || '').trim().slice(0, 160),
      category: (cats[state.pcat] && cats[state.pcat].label) || '',
      tags: tags, status: 'pending', createdAt: Date.now()
    });
  }
}

// ===== 運営メンバーの招待メール（Blazeプラン不要） =====
// 送信手段は2通り。無料でどちらも使える。
//  A) INVITE_ENDPOINT に Google Apps Script のウェブアプリURLを設定 → 自動送信
//     （設定方法は tools/invite-mailer.gs を参照。Googleアカウントの無料枠で送信）
//  B) 未設定なら、招待文を表示するダイアログを開き、メールソフトで送るかコピーして送る
//
// このURLは公開リポジトリに載るため「秘密にすることで守る」設計にはしていない。
// 件名・本文は Apps Script 側で固定してあり、ここから渡せるのは宛先と招待者名だけ。
// そのためURLを知られても、送れるのは SenpaiNet の招待文に限られる（+1日の送信上限あり）。
var INVITE_ENDPOINT = 'https://script.google.com/macros/s/AKfycbw-hD9VH3O-tGSa-IOnPbrWgIHgxvzbSw9iBN520DNm3x_5Zrs1imiN70lTZZs6AthxWg/exec';
// 実行中のドメインから作るので、github.io でも独自ドメインでも自動で正しくなる
var INVITE_URL = (typeof location !== 'undefined' ? location.origin : 'https://senpainet.github.io') + '/#admin';

function inviteMail(email, by, name){
  return {
    to: email,
    subject: '【SenpaiNet】運営メンバーに招待されました',
    body: (name ? name + ' 様\n\n' : '')
      + 'SenpaiNet の運営メンバーに追加されました。\n\n'
      + 'このメールアドレス（' + email + '）のGoogleアカウントで、管理コンソールにログインできます。\n\n'
      + '▼ 管理コンソール\n' + INVITE_URL + '\n\n'
      + 'ログイン方法：上記を開き「Googleでログイン」を選択してください。\n'
      + (by ? '招待者：' + by + '\n' : '')
      + '\n心当たりがない場合は、このメールは破棄してください。\nSenpaiNet 運営事務局'
  };
}
// A) Apps Script のウェブアプリに投げて自動送信する。
//    text/plain で送ることで CORS のプリフライトを避けている。
function sendInviteViaEndpoint(email, by, name){
  if(!INVITE_ENDPOINT) return null;
  return fetch(INVITE_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ to: email, by: by || '', name: name || '' })
  }).then(function(r){ return r.json(); })
    .then(function(j){ return { ok: !!(j && j.ok), error: j && j.error }; })
    .catch(function(){ return { ok:false, error:'network' }; });
}

  var m = inviteMail(email, by, name);

    + '<div style="background:#f7f9fc;border:1px solid #e7edf6;border-radius:11px;padding:13px 15px;margin-bottom:12px">'

    + '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px">'
    + '<button data-invite-copy="1" style="cursor:pointer;background:#fff;border:1.5px solid #d4dde9;color:#3a465f;font-weight:700;font-size:13.5px;padding:11px 20px;border-radius:10px">本文をコピー</button>'
    + '<a href="'+esc(mailto)+'" data-modal-close-btn style="text-decoration:none;background:#2f73e8;border:none;color:#fff;font-weight:700;font-size:13.5px;padding:11px 22px;border-radius:10px">メールソフトで開く</a>'

// 招待を送る（自動送信できればそれ、無理ならダイアログ）
function sendInvite(email, by, name){
  var p = sendInviteViaEndpoint(email, by, name);
  if(p){
    toast('招待メールを送信中…');
    p.then(function(res){
      if(res.ok){ toast(email+' に招待メールを送信しました'); return; }
      var msg = res.error==='daily limit reached' ? '本日の送信上限に達しました。手動で送ってください'
              : res.error==='invalid recipient'   ? 'メールアドレスの形式が正しくありません'
              : '自動送信に失敗しました。手動で送ってください';
      toast(msg);
      if(res.error!=='invalid recipient') openModal(inviteMailModal(email, by, name), 560);
    });
    return;
  }
  openModal(inviteMailModal(email, by, name), 560);
}

var REPORT_REASONS = [
  ['誹謗中傷・攻撃的な内容', '特定の人を傷つける言葉が含まれています'],
  ['個人情報が含まれている', '実名・学校名・連絡先などが書かれています'],
  ['スパム・宣伝目的', '営利目的の勧誘や無関係な宣伝です'],
  ['性的・暴力的な内容', '不快・有害な表現が含まれています'],

];
// 通報対象を { kind, id, idx } から解決し、種別名と本文の抜粋を返す
function reportSubject(tg){
  if(!tg) return null;
  if(tg.kind==='consultation'){
    var c = find(tg.id); if(!c) return null;
    return { type:'相談', text:c.title, targetType:'consultation', targetId:c.id };
  }
  if(tg.kind==='answer'){
    var pc = find(tg.id); var a = pc && pc.answers ? pc.answers[tg.idx] : null; if(!a) return null;
    return { type:'回答', text:(a.body||'').slice(0,60), targetType:'answer', targetId:pc.id, answerIndex:tg.idx };
  }
  if(tg.kind==='community'){
    var cp = findCommunityPost(tg.id); if(!cp) return null;
    return { type:'コミュニティ投稿', text:cp.title, targetType:'community', targetId:cp.id };
  }
  return null;
}

// 通報を送信する（運営の通報管理に届く）
function submitReport(){
  var s = reportSubject(state.reportTarget);
  if(!s){ toast('この投稿は見つかりませんでした'); return; }
  if(!state.reportReason){ toast('理由を選んでください'); return; }
  var note = (document.getElementById('report-note') || {}).value || state.reportNote || '';
  var rep = {
    id: 'rp_' + Date.now(),
    type: s.type,
    targetType: s.targetType,
    targetId: s.targetId,
    target: s.text,
    reason: state.reportReason,
    note: note.trim().slice(0, 500),
    reporter: state.setupStatus==='grad' ? '卒業生' : (state.setupStatus==='current' ? '在校生' : '匿名の利用者'),
    // ログイン中なら通報者にメール連絡できるよう uid を控える（匿名の相談本体には残さない）
    reporterUid: (state.authUser && state.authUser.uid) ? state.authUser.uid : null,
    time: 'たった今',
    createdAt: Date.now(),
    status: 'pending'
  };
  if(s.answerIndex != null) rep.answerIndex = s.answerIndex;
  state.adminReports = [rep].concat(state.adminReports);
  if(window.snDb && window.snDb.addReport) window.snDb.addReport(rep);
  state.reportTarget = null; state.reportReason = ''; state.reportNote = '';
  closeModal(); render();
  toast('通報を受け付けました。運営が確認します');
}

function deleteReportedContent(r){
  if(r.targetType==='consultation'){
    state.consultations = state.consultations.filter(function(x){ return x.id!==r.targetId; });
    if(window.snDb && window.snDb.deleteConsultation) window.snDb.deleteConsultation(r.targetId);
    if(state.adminSelectedId===r.targetId) state.adminSelectedId = null;
  } else if(r.targetType==='answer'){
    var pc = find(r.targetId);
    if(pc && pc.answers){
      var idx = r.answerIndex || 0, a = pc.answers[idx];
      if(a){
        if(a.id && window.snDb && window.snDb.deleteAnswer) window.snDb.deleteAnswer(pc.id, a.id);
        pc.answers.splice(idx, 1);
        if(pc.nAnswers > 0) pc.nAnswers -= 1;
      }
    }
  } else if(r.targetType==='community'){
    state.communityPosts = state.communityPosts.filter(function(x){ return x.id!==r.targetId; });
  }
  r.deleted = true;
}
function submitCommunityPost(){
  if(statusOf(state.userKaisei).type!=='grad'){ toast('投稿できるのは卒業生のみです'); return; }
  var txt = (state.communityText||'').trim();
  if(!txt || !state.communityGroup) return;
  state.communityPosts.unshift({ id:'cp_'+Date.now(), group:state.communityGroup, kaisei:state.userKaisei, univ:state.userUniv||'', body:txt, likes:0, liked:false, replies:0, time:'たった今', you:true });
  state.communityText='';
  render(); toast('コミュニティに投稿しました');
}

/* ============ BROWSE ============ */
function browseFiltered(){
  var q = state.query.trim();
  var list = state.consultations.filter(function(c){
    if(c.hidden) return false; // 運営が非表示にした相談は公開一覧から除外
    var catOk = state.activeCat==='all' || c.category===state.activeCat;
    // grade filter uses the asker's grade AT POSTING (frozen — does not shift year to year)
    var gradeOk = state.activeGrade==='all' || c.grade===state.activeGrade;
    var qOk = q==='' || (c.title+c.body).indexOf(q)!==-1;
    return catOk && gradeOk && qOk;
  });
  if(state.browseSort==='popular') list = list.slice().sort(function(a,b){ return b.likes - a.likes; });
  else list = list.slice().sort(function(a,b){ return timeRank(a.time) - timeRank(b.time); });
  return list;
}

    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap;gap:10px">'
    + '<div style="display:flex;align-items:center;gap:18px">'
    + '<span data-toast="画像の追加は準備中です" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#66738c"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>画像を追加</span>'
    + '<span data-answer-anon="1" style="cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#66738c">'+checkbox+'匿名で投稿</span></div>'
    + '<button id="submit-answer" style="cursor:pointer;border:none;background:#2f73e8;color:#fff;font-weight:700;font-size:13.5px;padding:11px 26px;border-radius:10px">回答する</button>'
    + '</div></div>';

  // answers (sorted without mutating; idx maps back to c.answers)
  var ordered = c.answers.map(function(a,i){ return { a:a, i:i }; });
  if(state.answerSort==='helpful') ordered.sort(function(x,y){ return y.a.helpful - x.a.helpful; });
  else ordered.sort(function(x,y){ return timeRank(x.a.time) - timeRank(y.a.time); });
  var answerCards = ordered.map(function(o){
    var a=o.a, idx=o.i;
    var badge = a.anon ? { label:'先輩', color:'#1f5fd0', bg:'#e8f1fe' } : personBadge(a.kaisei);
    var name = a.you ? (a.anon?'匿名の先輩':'あなた') : (a.anon?'匿名の先輩':a.kaisei+'回生');
    var heartColor = a.marked ? '#e0568a' : '#94a1b5';
    var youBg = a.you ? '#f2f7fd' : '#fff';
    // 返信一覧（回答の下にぶら下げて表示）
    var reps = Array.isArray(a.replies) ? a.replies : [];
    var replyCount = reps.length;
    var repliesHTML = reps.length ? '<div style="margin-top:14px;padding-left:16px;border-left:2px solid #e3ebf7;display:flex;flex-direction:column;gap:12px">'
      + reps.map(function(r){
          var rname = r.you ? 'あなた' : (r.kaisei ? r.kaisei+'回生' : '匿名');
          return '<div style="display:flex;gap:10px;align-items:flex-start">'+avatar(28,'#eef1f8','#94a1b5')
            + '<div style="min-width:0"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:12.5px;font-weight:700;color:#1b2942">'+esc(rname)+'</span><span style="font-size:11px;color:#94a1b5">'+esc(r.time||'')+'</span></div>'
            + '<p style="font-size:12.5px;color:#3a465f;line-height:1.85;margin:5px 0 0;white-space:pre-wrap">'+esc(r.body||'')+'</p></div></div>';
        }).join('')
      + '</div>' : '';
    // 返信フォーム（「返信する」を押した回答にだけ表示）
    var replyBox = state.replyTo===idx
      ? '<div style="margin-top:14px;padding-left:16px;border-left:2px solid #cfe0fb">'
        + '<textarea id="reply-text" placeholder="この回答に返信する…" style="width:100%;height:64px;border:1.5px solid #dde4f1;border-radius:10px;padding:10px 12px;font-size:13px;color:#1b2942;line-height:1.7;outline:none;resize:vertical;font-family:inherit">'+esc(state.replyText)+'</textarea>'
        + '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:8px">'
        + '<button data-reply-cancel="1" style="cursor:pointer;background:#fff;border:1.5px solid #d4dde9;color:#3a465f;font-weight:700;font-size:12.5px;padding:8px 16px;border-radius:9px">キャンセル</button>'
        + '<button id="reply-submit" style="cursor:pointer;border:none;background:#2f73e8;color:#fff;font-weight:700;font-size:12.5px;padding:8px 20px;border-radius:9px">返信する</button>'
        + '</div></div>'
      : '';
    // 自分の回答か（このセッションで投稿＝you、または保存済みの所有記録に一致）
    var mine = !!a.you || (a.id && state.myAnswerIds[a.id]);
    var editing = state.answerEditIdx === idx;
    // 本文（編集中はテキストエリアに差し替える）
    var bodyBlock = editing
      ? '<div style="margin-top:14px">'
        + '<textarea id="answer-edit-text" style="width:100%;box-sizing:border-box;height:96px;border:1.5px solid #2f73e8;border-radius:10px;padding:11px 13px;font-size:13.5px;color:#1b2942;line-height:1.85;outline:none;resize:vertical;font-family:inherit">'+esc(state.answerEditText)+'</textarea>'
        + '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:8px">'
        + '<button data-answer-edit-cancel="1" style="cursor:pointer;background:#fff;border:1.5px solid #d4dde9;color:#3a465f;font-weight:700;font-size:12.5px;padding:8px 16px;border-radius:9px">キャンセル</button>'
        + '<button data-answer-edit-save="'+idx+'" style="cursor:pointer;border:none;background:#2f73e8;color:#fff;font-weight:700;font-size:12.5px;padding:8px 20px;border-radius:9px">保存する</button>'
        + '</div></div>'
      : '<p style="font-size:13.5px;color:#3a465f;line-height:1.9;margin:14px 0 0;white-space:pre-wrap">'+esc(a.body)+'</p>';
    // 自分の回答は「編集・削除」、他人の回答は「通報」を出す
    var ownerOrReport = mine
      ? '<span style="margin-left:auto;display:inline-flex;gap:14px">'
        + '<span data-answer-edit="'+idx+'" style="cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#2f73e8"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>編集</span>'
        + '<span data-answer-del="'+idx+'" style="cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#c0392b"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/></svg>削除</span></span>'
      : '<span data-report-open="answer:'+c.id+':'+idx+'" title="この回答を通報する" style="margin-left:auto;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#b8c3d1"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15V4h13l-1.5 3.5L17 11H4"/><path d="M4 21v-6"/></svg>通報</span>';
    return '<div style="background:'+youBg+';border:1px solid #e7edf6;border-radius:16px;padding:20px 22px">'
      + '<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">'+avatar(36,'#eef1f8','#94a1b5')
      + '<span style="font-size:14px;font-weight:700;color:#1b2942">'+esc(name)+'</span>'
      + '<span style="font-size:10px;font-weight:700;color:'+badge.color+';background:'+badge.bg+';padding:2px 9px;border-radius:8px">'+badge.label+'</span>'
      + '<span style="font-size:10px;font-weight:700;color:#1e9e63;background:#e7f5ee;padding:2px 8px;border-radius:8px">先輩</span>'
      + '<span style="font-size:11.5px;color:#94a1b5;margin-left:auto">'+a.time+(a.editedAt?'・編集済み':'')+'</span></div>'
      + bodyBlock
      + '<div style="display:flex;align-items:center;gap:22px;margin-top:14px">'
      + '<button data-helpful="'+idx+'" style="border:none;background:none;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:6px;color:'+heartColor+';font-size:13px;font-weight:700">'+heart(16)+a.helpful+'</button>'
      + '<span data-reply-open="'+idx+'" style="cursor:pointer;font-size:13px;font-weight:700;color:'+(state.replyTo===idx?'#2f73e8':'#94a1b5')+'">返信する'+(replyCount?'（'+replyCount+'）':'')+'</span>'
      + ownerOrReport + '</div>'
      + repliesHTML + replyBox
      + '</div>';
  }).join('');

  var sortTabs = '<div style="display:flex;gap:16px">'
    + [['new','新しい順'],['helpful','いいね順']].map(function(t){
        var active = (state.answerSort||'new')===t[0];
        return '<span data-ansort="'+t[0]+'" style="font-size:13px;font-weight:'+(active?800:600)+';color:'+(active?'#2f73e8':'#94a1b5')+';border-bottom:2px solid '+(active?'#2f73e8':'transparent')+';padding-bottom:4px;cursor:pointer">'+t[1]+'</span>';
      }).join('') + '</div>';

  var answersSection = '<div id="answers">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin:6px 2px 16px">'
    + '<h2 style="margin:0;font-size:17px;font-weight:800;color:#1b2942">回答（'+c.answers.length+'件）</h2>'+sortTabs+'</div>'
    + '<div style="display:flex;flex-direction:column;gap:14px">'
    + (answerCards || '<div style="text-align:center;padding:30px;color:#94a1b5;font-size:13px;background:#fff;border:1px solid #e7edf6;border-radius:16px">まだ回答がありません。最初の先輩になりましょう。</div>')
    + '</div></div>';

  var left = '<div style="min-width:0;display:flex;flex-direction:column;gap:18px">'
    + post + composer + answersSection + '</div>';

  return '<main class="rs-pad" style="max-width:1180px;margin:0 auto;padding:24px 28px 80px">'
    + crumb + '<div class="detail-grid">' + left + detailRightHTML(c) + '</div></main>';
}

/* ============ MYPAGE ============ */
// マイページの実績を実データから集計
function computeMyStats(){
  var posts = state.myPosts.length, ans = 0, helpful = 0;
  state.consultations.forEach(function(c){ c.answers.forEach(function(a){ if(a.you){ ans++; helpful += a.helpful; } }); });
  return { posts: posts, answers: ans, helpful: helpful };
}
function mypageHTML(){
  var tab = state.mypageTab || 'overview';
  var ms = computeMyStats();
  var unread = state.notifications.filter(function(n){return n.unread;}).length;
  var mpEmpty = function(msg){ return '<div style="text-align:center;padding:34px 0;color:#9aa6ba;font-size:13px">'+msg+'</div>'; };

  // ---- sidebar ----
  var icons = {
    overview:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M5 21c0-4 3-6 7-6s7 2 7 6"/></svg>',
    posts:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-11.7 7.7L3 21l1.9-6.1A8.4 8.4 0 1 1 21 11.5z"/></svg>',
    bookmarks:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>',
    notifications:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/></svg>',
    settings:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.3l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2.2-1.3L14 2h-4l-.3 2.4a7 7 0 0 0-2.2 1.3l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .9.1 1.3l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2.2 1.3L10 22h4l.3-2.4a7 7 0 0 0 2.2-1.3l2.4 1 2-3.4-2-1.6c.1-.4.1-.9.1-1.3z"/></svg>',
    logout:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>'
  };
  function sideItem(key,label,badge){
    var active = tab===key;
    var b = badge ? '<span class="num" style="margin-left:auto;min-width:18px;text-align:center;font-size:10px;color:#fff;background:#e0568a;padding:1px 6px;border-radius:9px">'+badge+'</span>' : '';
    if(active) return '<div style="display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:700;color:#1f5fd0;background:#e8f1fe;padding:11px 14px;border-radius:10px">'+icons[key]+label+b+'</div>';
    return '<div data-mytab="'+key+'" style="display:flex;align-items:center;gap:10px;font-size:13.5px;color:#3a465f;padding:11px 14px;cursor:pointer;border-radius:10px">'+icons[key]+label+b+'</div>';
  }
  var side = sideItem('overview','マイページ')
    + sideItem('posts','自分の相談')
    + sideItem('bookmarks','ブックマーク')
    + sideItem('notifications','通知', unread||'')
    + sideItem('settings','プロフィール設定')
    + '<div data-logout="1" style="display:flex;align-items:center;gap:10px;font-size:13.5px;color:#3a465f;padding:11px 14px;cursor:pointer;border-radius:10px">'+icons.logout+'ログアウト</div>';

  // ---- profile card ----
  var pb = personBadge(state.userKaisei);
  var profile = '<div class="rs-stack-sm" style="background:#fff;border:1px solid #e7edf6;border-radius:16px;padding:22px;display:flex;align-items:center;justify-content:space-between;gap:14px">'
    + '<div style="display:flex;align-items:center;gap:16px"><div style="width:58px;height:58px;border-radius:50%;background:#e8f1fe;display:flex;align-items:center;justify-content:center"><svg width="34" height="34" viewBox="0 0 40 40"><circle cx="20" cy="16" r="7" fill="#2f73e8"/><path d="M7 35c0-7 6-10 13-10s13 3 13 10z" fill="#2f73e8"/></svg></div>'
    + '<div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:17px;font-weight:700;color:#1b2942">'+esc(state.userName)+'</span><span style="font-size:11px;font-weight:700;color:'+pb.color+';background:'+pb.bg+';padding:2px 9px;border-radius:10px">'+esc(personName(state.userKaisei))+'</span></div>'
    + (state.userUniv ? '<div style="font-size:12px;color:#66738c;margin-top:3px">'+esc(state.userUniv)+(state.userFaculty?' '+esc(state.userFaculty):'')+'</div>' : '')
    + '<div style="font-size:12.5px;color:#66738c;margin-top:4px">相談 <b style="color:#1b2942">'+ms.posts+'</b>件 ・ 回答 <b style="color:#1b2942">'+ms.answers+'</b>件 ・ 役に立った <b style="color:#1b2942">'+ms.helpful+'</b></div></div></div>'
    + '<button data-mytab="settings" style="cursor:pointer;background:#fff;border:1.5px solid #d4dde9;color:#3a465f;font-weight:700;font-size:12.5px;padding:9px 16px;border-radius:10px;display:inline-flex;align-items:center;gap:7px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4v16h16v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>プロフィール編集</button></div>';

  // ---- card builders ----
  function postCard(p,pi){
    var m=cats[p.category];
    var statusColor = p.status==='解決済み' ? '#2f73e8':'#e0892a';
    var openAttr = p.cid ? 'data-open="'+p.cid+'"' : 'data-mypost="'+pi+'"';
    return '<div '+openAttr+' style="background:#fff;border:1px solid #e7edf6;border-radius:13px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer">'
      + '<div><span style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:'+m.color+'"><span style="width:14px;height:14px;border-radius:4px;background:'+m.bg+'"></span>'+m.label+'</span>'
      + '<div style="font-size:15px;font-weight:700;color:#1b2942;margin:8px 0 5px">'+esc(p.title)+'</div>'
      + '<div style="font-size:11.5px;color:#9aa6ba">回答 '+p.nAnswers+'件 ・ '+p.time+'</div></div>'
      + '<span style="font-size:12px;font-weight:700;color:'+statusColor+';white-space:nowrap">'+p.status+' ›</span></div>';
  }
  function postsList(limit){
    if(state.myPosts.length===0) return mpEmpty('まだ相談を投稿していません。「相談する」から投稿してみましょう。');
    var arr = limit ? state.myPosts.slice(0,limit) : state.myPosts;
    return arr.map(function(p,i){ return postCard(p,i); }).join('');
  }
  function bmCard(c){
    var m=cats[c.category];
    return '<div data-open="'+c.id+'" style="background:#fff;border:1px solid #e7edf6;border-radius:13px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer">'
      + '<div><span style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:'+m.color+'"><span style="width:14px;height:14px;border-radius:4px;background:'+m.bg+'"></span>'+m.label+'</span>'
      + '<div style="font-size:15px;font-weight:700;color:#1b2942;margin:8px 0 5px">'+esc(c.title)+'</div>'
      + '<div style="font-size:11.5px;color:#9aa6ba">回答 '+c.nAnswers+'件 ・ '+c.time+'</div></div>'
      + '<button data-bookmark="'+c.id+'" style="border:none;background:none;cursor:pointer;padding:0">'+bookmark(17,20,'#2f73e8','#2f73e8')+'</button></div>';
  }
  function bmList(limit){
    var bms = state.consultations.filter(function(c){return c.bookmarked;});
    if(bms.length===0) return mpEmpty('ブックマークした相談はまだありません。');
    var arr = limit ? bms.slice(0,limit) : bms;
    return arr.map(bmCard).join('');
  }
  function blockHead(title, tabKey, count){
    return '<div style="display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px"><h3 style="margin:0;font-size:15px;font-weight:800;color:#1b2942">'+title+(count!=null?' <span style="color:#9aa6ba;font-weight:700">'+count+'</span>':'')+'</h3>'
      + (tabKey?'<span data-mytab="'+tabKey+'" style="font-size:12.5px;font-weight:700;color:#2f73e8;cursor:pointer">すべて見る ›</span>':'')+'</div>';
  }

  // ---- notifications (inline) ----
  function notifsInline(){
    var head = '<div style="display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px"><h3 style="margin:0;font-size:16px;font-weight:900;color:#1b2942">通知'+(unread?' <span class="num" style="font-size:12px;color:#fff;background:#e0568a;padding:1px 8px;border-radius:10px;margin-left:4px">'+unread+'</span>':'')+'</h3>'+(unread?'<span data-notif-read="all" style="font-size:12.5px;font-weight:700;color:#2f73e8;cursor:pointer">すべて既読</span>':'')+'</div>';
    if(state.notifications.length===0) return head + mpEmpty('通知はありません。');
    var items = state.notifications.map(function(n){

      return '<div data-notif="'+n.id+'" style="display:flex;gap:11px;padding:15px 16px;border:1px solid #e7edf6;border-radius:13px;cursor:pointer;background:'+(n.unread?'#f2f7fd':'#fff')+'">'+dot

        + '<div style="font-size:12.5px;color:#5a6678;line-height:1.65;margin:3px 0 4px">'+esc(n.body)+'</div>'
        + '<div style="font-size:11px;color:#9aa6ba">'+n.time+'</div></div></div>';
    }).join('');
    return head + '<div style="display:flex;flex-direction:column;gap:10px">'+items+'</div>';

  // ---- settings (inline form) ----
  function settingsForm(){
    var opts = '';
    for(var k=SCHOOL.baseKaisei; k>=SCHOOL.baseKaisei-8; k--){ opts += '<option value="'+k+'"'+(k===state.userKaisei?' selected':'')+'>'+esc(personName(k))+'</option>'; }

      + '<div style="background:#fff;border:1px solid #e7edf6;border-radius:16px;padding:24px 26px;max-width:540px">'
      + '<label style="display:block;font-size:13px;font-weight:700;color:#3a465f;margin-bottom:7px">表示名</label>'
      + '<input id="mp-name" value="'+esc(state.userName)+'" style="width:100%;border:1.5px solid #dde4f1;border-radius:10px;padding:12px 14px;font-size:14px;color:#1b2942;outline:none;margin-bottom:18px">'

function cmFeedFiltered(){
  var list = state.communityPosts.slice();
  if(state.communityFilter!=='all') list = list.filter(function(p){ return p.category===state.communityFilter; });
  var feedTab = state.communityFeedTab || 'all';
  if(feedTab==='following'){
    var followedKaisei = {};
    state.communityUsers.forEach(function(u){ if(state.followedUsers[u.id]) followedKaisei[u.kaisei]=1; });
    list = list.filter(function(p){ return followedKaisei[p.kaisei]; });
  }
  if(state.communitySort==='new') list.sort(function(a,b){ return timeRank(a.time)-timeRank(b.time); });
  else list.sort(function(a,b){ return b.likes-a.likes; });
  return list;
}

// 直近7日間の投稿数・回答数を実データから集計して折れ線にする
function admDaily(){
  var days = [], now = new Date();
  for(var i=6; i>=0; i--){
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    days.push({ start: d.getTime(), end: d.getTime() + 86400000, label: (d.getMonth()+1)+'/'+d.getDate(), posts: 0, answers: 0 });
  }
  state.consultations.forEach(function(c){
    var t = c.postedAt || c.createdAt || 0;
    days.forEach(function(d){ if(t >= d.start && t < d.end) d.posts++; });
    (c.answers||[]).forEach(function(an){
      var at = an.createdAt || 0;
      days.forEach(function(d){ if(at >= d.start && at < d.end) d.answers++; });
    });
  });
  return days;
}
function admLineChart(){
  var days = admDaily();
  var s1 = days.map(function(d){ return d.posts; });
  var s2 = days.map(function(d){ return d.answers; });
  var labels = days.map(function(d){ return d.label; });
  // 目盛りは実データの最大値に合わせる（0件でも軸がつぶれないよう最低4）
  var peak = Math.max(4, Math.max.apply(null, s1.concat(s2)));
  var step = Math.ceil(peak / 4);
  var top = step * 4;
  var W=640,H=250,x0=54,x1=616,yTop=24,yBot=200;
  function yv(v){ return yBot - (v/top)*(yBot-yTop); }
  function xi(i){ return x0 + i*((x1-x0)/6); }
  var grid='';
  [0,1,2,3,4].forEach(function(k){ var g=step*k, y=yv(g); grid += '<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="#e8edf5"/><text x="'+(x0-10)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#94a1b5">'+g+'</text>'; });
  var xlab = labels.map(function(l,i){ return '<text x="'+xi(i)+'" y="'+(yBot+22)+'" text-anchor="middle" font-size="11" fill="#94a1b5">'+l+'</text>'; }).join('');
  function poly(arr,color){ var pts=arr.map(function(v,i){ return xi(i)+','+yv(v); }).join(' '); var dots=arr.map(function(v,i){ return '<circle cx="'+xi(i)+'" cy="'+yv(v)+'" r="3.5" fill="#fff" stroke="'+color+'" stroke-width="2"/>'; }).join(''); return '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots; }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">'+grid+xlab+poly(s2,'#22b07d')+poly(s1,'#2f73e8')+'</svg>';
}
function admDonut(segs){
  var C = 2*Math.PI*42, off = 0;
  var circles = segs.map(function(s){ var len = s.pct/100*C; var el = '<circle cx="60" cy="60" r="42" fill="none" stroke="'+s.color+'" stroke-width="17" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 60 60)"/>'; off += len; return el; }).join('');
  return '<svg viewBox="0 0 120 120" width="132" height="132">'+circles+'</svg>';
}

// 絞り込み条件に合う相談だけを返す
function adminConsFiltered(){
  var q = (state.adminQ || '').trim().toLowerCase();
  return state.consultations.filter(function(c){
    if(state.adminCatF !== 'all' && c.category !== state.adminCatF) return false;
    var answered = (c.answers || []).length > 0;
    if(state.adminStatusF === 'answered' && !answered) return false;
    if(state.adminStatusF === 'unanswered' && answered) return false;
    if(state.adminStatusF === 'hidden' && !c.hidden) return false;
    if(q){
      var hay = ((c.title || '') + ' ' + (c.body || '') + ' ' + (c.tags || []).join(' ')).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  }).sort(function(x, y){
    if(state.adminSortF === 'answers') return (y.answers || []).length - (x.answers || []).length;
    if(state.adminSortF === 'views') return (y.views || 0) - (x.views || 0);
    if(state.adminSortF === 'old') return (x.postedAt || 0) - (y.postedAt || 0);
    return (y.postedAt || 0) - (x.postedAt || 0);
  });
}
// 一覧の行だけを組み立てる（検索中は入力欄の位置を保つため、ここだけ差し替える）

  var sel = state.adminSelectedId ? find(state.adminSelectedId) : null;

      + (state.adminQ || state.adminCatF !== 'all' || state.adminStatusF !== 'all'
          ? '条件に合う相談がありません。<br><span style="font-size:12px">検索語や絞り込みを変えてみてください。</span>'
          : '相談がありません。') + '</div>';
  }
  return list.map(function(c){
    var m = cats[c.category];
    var on = sel && c.id === sel.id;
    var answered = (c.answers || []).length > 0;
    return '<div data-admin-view="'+c.id+'" class="row-hover" style="cursor:pointer;padding:13px 16px;border-bottom:1px solid #eef1f7;border-left:3px solid '+(on?'#2f73e8':'transparent')+';background:'+(on?'#f2f7fd':(c.hidden?'#fbfcfe':'#fff'))+'">'
      + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px">'
      + admBadge(m.label, m.color, m.bg)
      + (answered ? admBadge('回答あり','#1e9e63','#e7f5ee') : admBadge('未回答','#e0568a','#fce8f1'))
      + (c.hidden ? admBadge('非表示','#5a6675','#eaeef4') : '')
      + '</div>'
      + '<div style="font-size:13.5px;font-weight:700;color:#1b2942;line-height:1.5'+(c.hidden?';opacity:.55':'')+'">'+esc(c.title)+'</div>'
      + '<div style="font-size:11px;color:#94a1b5;margin-top:5px">'+(GRADE_LABELS[c.grade]||'-')+' ・ 回答 '+(c.answers||[]).length+' ・ 閲覧 '+(c.views||0)+' ・ '+esc(c.time||'')+'</div>'
      + '</div>';
  }).join('');
}

function adminConsultations(){

  // ---- 絞り込みバー ----

    var o = opts.map(function(x){ return '<option value="'+x[0]+'"'+(cur===x[0]?' selected':'')+'>'+x[1]+'</option>'; }).join('');
    return '<select id="'+id+'" '+attr+' style="border:1.5px solid #dde4f1;border-radius:9px;padding:8px 11px;font-size:12.5px;color:#1b2942;background:#fff;outline:none;cursor:pointer">'+o+'</select>';

  var searchIcon = '<span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;color:#a8b3c4"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></span>';
  var filterBar = '<div style="padding:14px 16px;border-bottom:1px solid #eef1f7;display:flex;flex-direction:column;gap:10px">'
    + '<div style="position:relative">'+searchIcon
    + '<input id="admin-cons-q" value="'+esc(state.adminQ||'')+'" placeholder="タイトル・本文・タグで検索" style="width:100%;box-sizing:border-box;border:1.5px solid #dde4f1;border-radius:9px;padding:9px 12px 9px 34px;font-size:13px;color:#1b2942;outline:none">'
    + '</div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
    + selBox('admin-cons-cat','', catOpts, state.adminCatF)
    + selBox('admin-cons-status','', [['all','すべての状態'],['unanswered','未回答'],['answered','回答あり'],['hidden','非表示中']], state.adminStatusF)
    + selBox('admin-cons-sort','', [['new','新しい順'],['old','古い順'],['answers','回答が多い順'],['views','閲覧が多い順']], state.adminSortF)
    + ((state.adminQ || state.adminCatF !== 'all' || state.adminStatusF !== 'all')
        ? '<button data-admin-cons-reset="1" style="cursor:pointer;background:#fff;border:1.5px solid #dde4f1;color:#66738c;font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:9px">条件をクリア</button>' : '')

  var countLabel = '<span id="admin-cons-count" style="font-size:12px;color:#66738c">'+filtered.length+' / '+state.consultations.length+' 件</span>';

    filterBar + '<div id="admin-cons-list" style="max-height:560px;overflow-y:auto">'+adminConsRowsHTML()+'</div>');


  // ---- 右：選択した相談のプレビュー（このページ内で確認・操作） ----
  var preview;
  if(!sel){
    preview = admCard('プレビュー','', '<div style="padding:40px;text-align:center;color:#94a1b5;font-size:13px">左の一覧から相談を選んでください。</div>');
  } else {
    var m2 = cats[sel.category];
    var tagChips = (Array.isArray(sel.tags) && sel.tags.length)
      ? '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:12px">'+sel.tags.map(function(t){ return '<span style="font-size:11px;font-weight:600;color:#5a6678;background:#eef1f7;padding:4px 10px;border-radius:8px">#'+esc(t)+'</span>'; }).join('')+'</div>'
      : '';
    // 回答と返信
    var answers = (sel.answers||[]).map(function(a){
      var reps = Array.isArray(a.replies) ? a.replies : [];
      var repHTML = reps.length ? '<div style="margin-top:10px;padding-left:12px;border-left:2px solid #e3ebf7;display:flex;flex-direction:column;gap:8px">'
        + reps.map(function(r){ return '<div><div style="font-size:11px;color:#94a1b5">'+(r.kaisei?r.kaisei+'回生':'匿名')+' ・ '+esc(r.time||'')+'</div><div style="font-size:12px;color:#3a465f;line-height:1.8;margin-top:2px;white-space:pre-wrap">'+esc(r.body||'')+'</div></div>'; }).join('')
        + '</div>' : '';
      return '<div style="border:1px solid #eef1f7;border-radius:12px;padding:14px 16px">'
        + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:12.5px;font-weight:700;color:#1b2942">'+(a.anon?'匿名の先輩':(a.kaisei?a.kaisei+'回生':'先輩'))+'</span>'
        + '<span style="font-size:11px;color:#94a1b5">'+esc(a.time||'')+'</span>'
        + '<span style="margin-left:auto;font-size:11px;color:#94a1b5">役に立った '+(a.helpful||0)+'</span></div>'
        + '<p style="font-size:12.5px;color:#3a465f;line-height:1.85;margin:9px 0 0;white-space:pre-wrap">'+esc(a.body||'')+'</p>'
        + repHTML + '</div>';
    }).join('');
    var answersBlock = (sel.answers && sel.answers.length)
      ? '<div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">'+answers+'</div>'
      : '<div style="padding:18px;text-align:center;color:#94a1b5;font-size:12.5px;background:#fbfcfe;border-radius:12px;margin-top:12px">まだ回答がありません。</div>';

    var actions = '<div style="display:flex;gap:9px;flex-wrap:wrap">'
      + admActionBtn(sel.hidden?'再表示する':'非表示にする','data-admin-hide="'+sel.id+'"', sel.hidden?'primary':'danger')
      + admActionBtn('公開ページで開く','data-open="'+sel.id+'"','')
      + admActionBtn('削除する','data-admin-del-cons="'+sel.id+'"','danger')
      + '</div>';

    var inner = '<div style="padding:20px 22px">'
      + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+admBadge(m2.label, m2.color, m2.bg)
      + '<span style="font-size:11.5px;color:#66738c">在校生・'+(GRADE_LABELS[sel.grade]||'-')+'</span>'
      + (sel.hidden ? admBadge('非表示中','#5a6675','#eaeef4') : admBadge('公開中','#1e9e63','#e7f5ee')) + '</div>'
      + '<h3 style="margin:12px 0 0;font-size:17px;font-weight:900;color:#14233f;line-height:1.55">'+esc(sel.title)+'</h3>'
      + '<div style="font-size:11.5px;color:#94a1b5;margin-top:7px">'+esc(sel.time||'')+' ・ 閲覧 '+sel.views+' ・ いいね '+sel.likes+' ・ 回答 '+(sel.answers?sel.answers.length:0)+'</div>'
      + tagChips
      + '<div style="font-size:13px;color:#3a465f;line-height:1.95;white-space:pre-wrap;margin-top:14px;padding:14px 16px;background:#fbfcfe;border:1px solid #eef1f7;border-radius:12px">'+esc(sel.body)+'</div>'
      + '<div style="margin-top:16px">'+actions+'</div>'
      + '<div style="font-size:12.5px;font-weight:800;color:#1b2942;margin-top:20px">回答（'+(sel.answers?sel.answers.length:0)+'件）</div>'
      + answersBlock
      + '</div>';
    preview = admCard('プレビュー','', inner);
  }

  return admPageHead('相談管理','投稿された相談の確認・非表示化を行えます。一覧から選ぶと、このページ内で内容を確認できます。')
    + '<div class="admin-split">'+listCard+preview+'</div>';
}

function adminReports(){
  // 運営が通報管理を開いたら、Firestore から実際の通報を読み込む（初回のみ）
  if(!state.adminReportsLoaded && window.snDb && window.snDb.loadReports){
    state.adminReportsLoaded = true; window.snDb.loadReports();
  }
  var list = state.adminReports;
  // 選択中の通報（未選択なら未対応の先頭、無ければ先頭）
  var sel = null;
  if(state.adminReportId) sel = findById(list, state.adminReportId);
  if(!sel) sel = list.filter(function(r){ return r.status==='pending'; })[0] || list[0] || null;

  // ---- 左：通報リスト ----
  var rows = list.map(function(r){
    var on = sel && r.id === sel.id;
    return '<div data-admin-report-view="'+r.id+'" class="row-hover" style="cursor:pointer;padding:13px 16px;border-bottom:1px solid #eef1f7;border-left:3px solid '+(on?'#2f73e8':'transparent')+';background:'+(on?'#f2f7fd':'#fff')+'">'
      + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px">'
      + admBadge(r.type,'#5a6675','#eef1f7') + admStatusBadge(r.status) + '</div>'
      + '<div style="font-size:13.5px;font-weight:700;color:#1b2942;line-height:1.5'+(r.status==='resolved'?';opacity:.6':'')+'">'+esc(r.target)+'</div>'
      + '<div style="font-size:11px;color:#94a1b5;margin-top:5px">'+esc(r.reason)+' ・ '+esc(r.time||'')+'</div>'
      + '</div>';
  }).join('') || '<div style="padding:24px;text-align:center;color:#94a1b5;font-size:13px">通報はありません。</div>';
  var pending = list.filter(function(r){ return r.status==='pending'; }).length;
  var extra = '<span style="font-size:12px;color:#66738c">未対応 <span style="font-weight:800;color:#c07a12">'+pending+'</span> 件</span>';
  var listCard = admCard('通報一覧（'+list.length+'件）', extra, '<div style="max-height:640px;overflow-y:auto">'+rows+'</div>');

  // ---- 右：選択した通報の詳細（通報された投稿の全体を表示） ----
  var preview;
  if(!sel){
    preview = admCard('詳細','', '<div style="padding:40px;text-align:center;color:#94a1b5;font-size:13px">左の一覧から通報を選んでください。</div>');
  } else {
    function row(k, v){ return '<div style="display:flex;gap:14px;padding:11px 0;border-bottom:1px solid #eef1f7"><div style="width:88px;flex-shrink:0;font-size:12px;font-weight:700;color:#8a97ac">'+k+'</div><div style="flex:1;font-size:13px;color:#3a465f;line-height:1.7">'+v+'</div></div>'; }
    function block(label, body){ return '<div style="margin-top:16px"><div style="font-size:12px;font-weight:800;color:#8a97ac;margin-bottom:8px">'+label+'</div>'+body+'</div>'; }
    function postCard(inner){ return '<div style="border:1px solid #e7edf6;border-radius:12px;padding:16px 18px;background:#fbfcfe">'+inner+'</div>'; }

    // 通報された投稿の全文を表示する
    var content = '', extraActions = '';
    if(sel.targetType==='consultation'){
      var c = find(sel.targetId);
      if(c){
        var mc = cats[c.category];
        var tg = (Array.isArray(c.tags)&&c.tags.length) ? '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">'+c.tags.map(function(t){return '<span style="font-size:11px;color:#5a6678;background:#eef1f7;padding:3px 9px;border-radius:7px">#'+esc(t)+'</span>';}).join('')+'</div>' : '';
        content = block('通報された相談（全文）', postCard(
            '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+admBadge(mc.label,mc.color,mc.bg)
          + '<span style="font-size:11.5px;color:#66738c">在校生・'+(GRADE_LABELS[c.grade]||'-')+'</span>'
          + (c.hidden?admBadge('非表示中','#5a6675','#eaeef4'):admBadge('公開中','#1e9e63','#e7f5ee'))+'</div>'
          + '<div style="font-size:15px;font-weight:900;color:#14233f;margin:11px 0 0;line-height:1.55">'+esc(c.title)+'</div>'
          + '<div style="font-size:11.5px;color:#94a1b5;margin-top:6px">'+esc(c.time||'')+' ・ 閲覧 '+c.views+' ・ いいね '+c.likes+' ・ 回答 '+(c.answers?c.answers.length:0)+'</div>'
          + tg
          + '<p style="font-size:13px;color:#3a465f;line-height:1.95;margin:12px 0 0;white-space:pre-wrap">'+esc(c.body)+'</p>'));
        extraActions = admActionBtn(c.hidden?'この相談を再表示':'この相談を非表示にする','data-admin-hide="'+c.id+'"', c.hidden?'primary':'danger')
          + admActionBtn('相談管理で開く','data-admin-open-cons="'+c.id+'"','');
      }
    } else if(sel.targetType==='answer'){
      var pc = find(sel.targetId);
      var ai = sel.answerIndex || 0;
      var an = pc && pc.answers ? pc.answers[ai] : null;
      if(pc && an){
        var reps = Array.isArray(an.replies) ? an.replies : [];
        var repHTML = reps.length ? '<div style="margin-top:10px;padding-left:12px;border-left:2px solid #e3ebf7;display:flex;flex-direction:column;gap:8px">'
          + reps.map(function(r){ return '<div><div style="font-size:11px;color:#94a1b5">'+(r.kaisei?r.kaisei+'回生':'匿名')+' ・ '+esc(r.time||'')+'</div><div style="font-size:12px;color:#3a465f;line-height:1.8;margin-top:2px;white-space:pre-wrap">'+esc(r.body||'')+'</div></div>'; }).join('')
          + '</div>' : '';
        content = block('通報された回答（全文）', postCard(
            '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:12.5px;font-weight:700;color:#1b2942">'+(an.anon?'匿名の先輩':(an.kaisei?an.kaisei+'回生':'先輩'))+'</span>'
          + '<span style="font-size:11px;color:#94a1b5">'+esc(an.time||'')+'</span>'
          + '<span style="margin-left:auto;font-size:11px;color:#94a1b5">役に立った '+(an.helpful||0)+'</span></div>'
          + '<p style="font-size:13px;color:#3a465f;line-height:1.95;margin:10px 0 0;white-space:pre-wrap">'+esc(an.body||'')+'</p>'
          + repHTML))
          + block('この回答が付いている相談', postCard(
              '<div style="font-size:14px;font-weight:800;color:#14233f;line-height:1.55">'+esc(pc.title)+'</div>'
            + '<p style="font-size:12.5px;color:#66738c;line-height:1.9;margin:9px 0 0;white-space:pre-wrap">'+esc(pc.body)+'</p>'));
        extraActions = admActionBtn('相談管理で開く','data-admin-open-cons="'+pc.id+'"','');
      }
    } else if(sel.targetType==='community'){
      var cp = findCommunityPost(sel.targetId);
      if(cp){
        content = block('通報されたコミュニティ投稿（全文）', postCard(
            '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:12.5px;font-weight:700;color:#1b2942">'+cp.kaisei+'回生'+(cp.univ?'・'+esc(cp.univ):'')+'</span>'
          + '<span style="font-size:11px;color:#94a1b5">'+esc(cp.time||'')+'</span>'
          + '<span style="margin-left:auto;font-size:11px;color:#94a1b5">いいね '+(cp.likes||0)+' ・ 返信 '+(cp.replies||0)+'</span></div>'
          + '<div style="font-size:14.5px;font-weight:800;color:#14233f;margin:10px 0 0;line-height:1.55">'+esc(cp.title)+'</div>'
          + '<p style="font-size:13px;color:#3a465f;line-height:1.95;margin:9px 0 0;white-space:pre-wrap">'+esc(cp.body||'')+'</p>'));
      }
    }
    if(!content){
      content = block('通報された内容', postCard('<p style="font-size:13px;color:#3a465f;line-height:1.9;margin:0;white-space:pre-wrap">'+esc(sel.target)+'</p>'
        + '<div style="font-size:11.5px;color:#94a1b5;margin-top:10px">※ 元の投稿が見つかりませんでした（削除済みの可能性があります）。</div>'));
    }

    // 投稿者アカウント（警告・停止の対象）
    var au = reportAuthor(sel);
    var authorBlock = au
      ? block('投稿者アカウント', postCard(
          '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
        + '<span style="font-size:13px;font-weight:700;color:#1b2942">'+esc(au.handle)+'</span>'
        + (au.role==='卒業生' ? admBadge('卒業生','#1f5fd0','#e8f1fe') : admBadge('在校生','#0284a8','#dbf1f8'))
        + '<span style="font-size:11.5px;color:#66738c">'+au.kaisei+'回生</span>'
        + admStatusBadge(au.status)
        + (au.warnings ? admBadge('警告 '+au.warnings+'回','#c07a12','#fdf0dc') : '')
        + '</div>'
        + '<div style="font-size:11.5px;color:#94a1b5;margin-top:8px">投稿 '+au.posts+' ・ 回答 '+au.answers+' ・ 登録 '+esc(au.joined)+'</div>'))
      : block('投稿者アカウント', postCard('<div style="font-size:12.5px;color:#94a1b5">投稿者を特定できませんでした（匿名投稿）。</div>'));

    // 対応：警告／アカウント停止／投稿の削除
    var measures = sel.status==='pending'
      ? '<div style="margin-top:18px"><div style="font-size:12px;font-weight:800;color:#8a97ac;margin-bottom:9px">この通報への対応</div>'

// スクロールで表示領域に入った .reveal 要素をふわっと出す
var _revObserver = null;
function observeReveals(){
  var els = document.querySelectorAll('.reveal:not(.reveal-in)');
  if(typeof IntersectionObserver === 'undefined'){ els.forEach(function(el){ el.classList.add('reveal-in'); }); return; }
  if(!_revObserver){
    _revObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('reveal-in'); _revObserver.unobserve(en.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
  }
  els.forEach(function(el){ _revObserver.observe(el); });
}

nfirm],[data-report-open],[data-report-reason],[data-report-submit],[data-admin-remove-confirm],[data-report-confirm],[data-report-reason-fill],[data-report-warn],[data-report-suspend],[data-report-delete],[data-report-dismiss],[data-menu]');

      var rd=findById(state.adminReports, t.getAttribute('data-report-delete'));
      if(rd){ deleteReportedContent(rd); rd.status='resolved'; rd.action='投稿を削除'; rd.actionReason=reasonD; rd.actionAt='たった今'; state.adminReportId=rd.id;
        applyReportUpdate(rd); notifyModeration(rd, 'delete', '投稿の削除', reasonD);
        closeModal(); render(); toast('投稿を削除し、通知を送信しました'); }
      else closeModal();
      return;
    }
    if(t.hasAttribute('data-report-dismiss')){
      var reasonN = readActionReason(); if(reasonN === null) return;
      var rn=findById(state.adminReports, t.getAttribute('data-report-dismiss'));
      if(rn){ rn.status='resolved'; rn.action='対応不要'; rn.actionReason=reasonN; rn.actionAt='たった今'; state.adminReportId=rn.id;
        applyReportUpdate(rn); notifyModeration(rn, 'dismiss', '対応不要としての処理', reasonN);
        closeModal(); render(); toast('対応不要として処理し、通知を送信しました'); }
      else closeModal();
      return;
    }
    if(t.hasAttribute('data-admin-report-resolve')){ var rr=findById(state.adminReports, t.getAttribute('data-admin-report-resolve')); if(rr){ rr.status='resolved'; if(window.snDb && window.snDb.updateReport) window.snDb.updateReport(rr.id, {status:'resolved'}); render(); toast('対応済みにしました'); } return; }
    if(t.hasAttribute('data-admin-report-del')){ var rid=t.getAttribute('data-admin-report-del'); if(window.snDb && window.snDb.deleteReport) window.snDb.deleteReport(rid); state.adminReports=state.adminReports.filter(function(r){ return r.id!==rid; }); if(state.adminReportId===rid) state.adminReportId=null; render(); toast('通報を削除しました'); return; }
  });
}
