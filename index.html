window.snOnAuthChange = function(user, authorized, configured, profile){
  var wasPending = state.pendingSignIn;

  state.authReady = true;

  if(user && profile){
    if(profile.kaisei) state.userKaisei = profile.kaisei;

    if(profile.univ != null) state.userUniv = profile.univ;

<!-- ============================================================
     Firebase 認証（Googleログイン＋招待制の許可リスト）
     管理コンソール（#admin）を、招待された運営メンバーだけに限定します。

     ▼ セットアップ手順（一度だけ）
       1. https://console.firebase.google.com でプロジェクトを作成
       2. Authentication → Sign-in method で「Google」を有効化

          「senpainet.github.io」（と、ローカル確認用に「localhost」）を追加
       4. プロジェクトの設定 → マイアプリ（ウェブ）の firebaseConfig を下の
          firebaseConfig に貼り付け（apiKey 等は公開されても問題ない値です）
       5. 下の ADMIN_EMAILS に、閲覧を許可する運営メンバーの Gmail を追加
          （任意：Firestore の admins/{email} に {allowed:true} でも可）

     ※注意：これは「UIのゲート＋本人確認」です。本アプリの管理データは
       すべてクライアント側のデモデータのため、これ自体は完全なアクセス制御
       ではありません。実データを守るには Firestore にデータを置き、
       セキュリティルールで admins のみ許可する構成が必要です。
     ============================================================ -->

        addAnswer: async (cid, a) => { localDirty = true; try { const ref = await addDoc(collection(db, "consultations", cid, "answers"), a); return ref.id; } catch (e) { return null; } },
        // 返信は回答のサブコレクション consultations/{cid}/answers/{aid}/replies に保存

                html: "<p>SenpaiNet の運営メンバーに追加されました。</p>"
                  + "<p>このメールアドレス（<strong>" + email + "</strong>）のGoogleアカウントで、管理コンソールにログインできます。</p>"
                  + '<p><a href="' + url + '" style="display:inline-block;background:#2f73e8;color:#fff;padding:12px 22px;border-radius:8px;text-decoration:none">管理コンソールを開く</a></p>'
                  + "<p style=\"font-size:13px;color:#555\">ログイン方法：上記を開き「Googleでログイン」を選択してください。"
                  + (by ? "<br>招待者：" + by : "") + "</p>"
                  + '<p style="font-size:12px;color:#888">心当たりがない場合は、このメールは破棄してください。<br>SenpaiNet 運営事務局</p>'
              },
              createdAt: Date.now()
            });
            return true;
          } catch (e) { return false; }
        },
        removeAdmin: async (email) => { try { await deleteDoc(doc(db, "admins", email)); return true; } catch (e) { return false; } },
        // 先輩プロフィール（得意分野タグ＋通知先メール）。メールは公開読み取り不可。
        // ログイン中は uid をドキュメントIDにして「上書き保存」できるようにする。
        // 未ログインのときだけ従来どおり新規作成（あとから編集はできない）。
        saveSenpaiProfile: async (p) => {
          try {
            const u = auth.currentUser;
            if (u) {
              p.uid = u.uid;
              if (!p.updatedAt) p.updatedAt = Date.now();
              await setDoc(doc(db, "senpaiProfiles", u.uid), p, { merge: true });
            } else {
              await addDoc(collection(db, "senpaiProfiles"), p);
            }
          } catch (e) {}
        },
        // 自分の先輩プロフィールを読む（マイページの初期表示用）
        loadSenpaiProfile: async (uid) => {
          try {
            const ds = await getDoc(doc(db, "senpaiProfiles", uid));
            return ds.exists() ? ds.data() : null;
          } catch (e) { return null; }
        },
        // ログインユーザーのプロフィール（本人のみ読み書き可）
        saveUserProfile: async (uid, p) => { try { await setDoc(doc(db, "users", uid), p, { merge: true }); } catch (e) {} },
        // お問い合わせ（送信は誰でも／閲覧・対応は運営のみ＝ルールで保護）
        // notified:false のまま保存し、Apps Script が拾って運営メンバー全員へ通知する
        addContact: async (c) => { try { await setDoc(doc(db, "contacts", c.id), c); } catch (e) {} },
        loadContacts: async () => {
          try {
            const snap = await getDocs(collection(db, "contacts"));
            const arr = []; snap.forEach((ds) => { const o = ds.data() || {}; o.id = ds.id; arr.push(o); });
            arr.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            if (window.snOnContacts) window.snOnContacts(arr);
          } catch (e) {}
        },
        updateContact: async (id, patch) => { try { await setDoc(doc(db, "contacts", id), patch, { merge: true }); } catch (e) {} },
        deleteContact: async (id) => { try { await deleteDoc(doc(db, "contacts", id)); } catch (e) {} },
        // 通報対応の通知（理由つき）をキューに積む。Apps Script が通報者・投稿者へ送る
        enqueueModerationNotice: async (n) => { try { await setDoc(doc(db, "moderationNotices", n.id), n); } catch (e) {} },
        // 利用者からの通報を保存する（作成は誰でも可／閲覧は運営のみ＝ルールで保護）
        addReport: async (r) => { try { await setDoc(doc(db, "reports", r.id), r); } catch (e) {} },
        // 運営が通報一覧を読み込む
        loadReports: async () => {
          try {
            const snap = await getDocs(collection(db, "reports"));
            const arr = []; snap.forEach((ds) => { const o = ds.data() || {}; o.id = ds.id; arr.push(o); });
            arr.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            if (window.snOnReports) window.snOnReports(arr);
          } catch (e) {}
        },
        updateReport: async (id, patch) => { try { await setDoc(doc(db, "reports", id), patch, { merge: true }); } catch (e) {} },
        deleteReport: async (id) => { try { await deleteDoc(doc(db, "reports", id)); } catch (e) {} },
        // マイページ用の投稿履歴（相談本体は匿名のまま、本人の配下にだけ記録）
        addMyPost: async (uid, cid, p) => { try { await setDoc(doc(db, "users", uid, "myPosts", cid), p); } catch (e) {} },
        deleteMyPost: async (uid, cid) => { try { await deleteDoc(doc(db, "users", uid, "myPosts", cid)); } catch (e) {} },
        // 投稿者の記録。相談本体は匿名のままにして、uid はこちらに分けて持つ。
        // 本人が編集・削除できるかの判定に、セキュリティルールから参照される。
        addConsultationOwner: async (cid, uid) => { try { await setDoc(doc(db, "consultationOwners", cid), { uid: uid, createdAt: Date.now() }); } catch (e) {} },
        // タグ付き相談の通知キュー。マッチングとメール送信はサーバー側で行う。
        enqueueNotify: async (q) => { try { await addDoc(collection(db, "mailQueue"), q); } catch (e) {} },
        // 相談タグ（config/hashtags に配列で保存。読み取りは全員、書き込みは運営のみ）
        loadTags: async () => {
          try {
            const ds = await getDoc(doc(db, "config", "hashtags"));
            const list = ds.exists() ? (ds.data() || {}).list : null;
            if (Array.isArray(list) && list.length && window.snOnTags) window.snOnTags(list);
          } catch (e) {}
        },
        saveTags: async (list) => { try { await setDoc(doc(db, "config", "hashtags"), { list: list, updatedAt: Date.now() }); } catch (e) {} }
      };
      async function loadConsultations() {
        try {
          const snap = await getDocs(collection(db, "consultations"));
          const map = {}, list = [];
          snap.forEach((ds) => { const o = ds.data() || {}; o.id = ds.id; o.liked = false; o.bookmarked = false; if (!Array.isArray(o.answers)) o.answers = []; map[ds.id] = o; list.push(o); });
          // 回答を取得して各相談にひも付け（サブコレクションが正）
          let byC = null;
          try {
            // 1) まとめて取得（コレクショングループ）
            const asnap = await getDocs(collectionGroup(db, "answers"));
            byC = {};
            asnap.forEach((ad) => { const cid = ad.ref.parent.parent.id; const o = Object.assign({}, ad.data()); o.id = ad.id; (byC[cid] = byC[cid] || []).push(o); });
          } catch (e) {
            // 2) 失敗時は相談ごとに個別取得（保険）
            byC = {};
            await Promise.all(list.map(async (o) => {
              try {
                const s2 = await getDocs(collection(db, "consultations", o.id, "answers"));
                const arr = []; s2.forEach((ad) => { const x = Object.assign({}, ad.data()); x.id = ad.id; arr.push(x); });
                if (arr.length) byC[o.id] = arr;
              } catch (e2) {}
            }));
          }
          Object.keys(byC || {}).forEach((cid) => {
            if (!map[cid]) return;
            const arr = byC[cid];
            arr.sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0));
            arr.forEach((a) => { a.you = false; a.marked = false; if (a.helpful == null) a.helpful = 0; if (!Array.isArray(a.replies)) a.replies = []; });
            map[cid].answers = arr;
          });
          // 返信（回答のサブコレクション）をまとめて取得して各回答にひも付け
          try {
            const rsnap = await getDocs(collectionGroup(db, "replies"));
            const byA = {};
            rsnap.forEach((rd) => { const aid = rd.ref.parent.parent.id; (byA[aid] = byA[aid] || []).push(Object.assign({}, rd.data())); });
            list.forEach((o) => (o.answers || []).forEach((a) => {
              if (a.id && byA[a.id]) { const arr = byA[a.id]; arr.sort((x, y) => (x.createdAt || 0) - (y.createdAt || 0)); a.replies = arr; }
            }));
          } catch (e) { /* 返信が取れなくても回答は表示する */ }
          // 読み込み中にユーザーが投稿していたら上書きしない
          if (list.length && !localDirty && window.snOnConsultations) window.snOnConsultations(list);
        } catch (e) { /* 取得失敗時は組み込みのシードのまま */ }
      }
      loadConsultations();
      window.snDb.loadTags();

      const allowList = ADMIN_EMAILS.map(e => e.toLowerCase());
      async function isAuthorized(user) {
        if (!user || !user.email) return false;
        const email = user.email.toLowerCase();
        if (allowList.indexOf(email) !== -1) return true;
        // 任意：Firestore の admins/{email} に {allowed:true} があれば許可
        try {
          const snap = await getDoc(doc(db, "admins", email));
          if (snap.exists() && snap.data() && snap.data().allowed) return true;
        } catch (e) { /* Firestore 未設定/権限なしは無視して配列判定のみ */ }
        return false;
      }

      onAuthStateChanged(auth, async (user) => {
        const authorized = user ? await isAuthorized(user) : false;
        // 保存済みプロフィール（回生・ニックネーム等）を読み込んで復元する
        let profile = null;
        if (user) { try { const ps = await getDoc(doc(db, "users", user.uid)); if (ps.exists()) profile = ps.data(); } catch (e) {} }
        const u = user ? { uid: user.uid, email: user.email, name: user.displayName || "", photo: user.photoURL || "" } : null;
        if (window.snOnAuthChange) window.snOnAuthChange(u, authorized, true, profile);
        // 先輩プロフィール（得意分野タグ・通知先）を読み込んでマイページに反映
        if (user && window.snOnSenpaiProfile) {
          const sp = await window.snDb.loadSenpaiProfile(user.uid);
          if (sp) window.snOnSenpaiProfile(sp);
        }
        // 運営メンバーがログインしたら「登録済み」として記録する
        if (user && authorized && user.email) {
          try { await window.snDb.markAdminJoined(user.email, user.displayName || ""); } catch (e) {}
        }
        // マイページ用の投稿履歴（本人のみ読める）
        if (user && window.snOnMyPosts) {
          try {
            const ps2 = await getDocs(collection(db, "users", user.uid, "myPosts"));
            const arr = []; ps2.forEach((pd) => { const o = pd.data() || {}; o.cid = pd.id; arr.push(o); });
            arr.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            window.snOnMyPosts(arr);
          } catch (e) {}
        }
        // 自分の回答の一覧（編集・削除の可否判定＋通知に使う）
        if (user && window.snOnMyAnswers) {
          try {
            const as = await getDocs(collection(db, "users", user.uid, "myAnswers"));
            const map = {}; as.forEach((ad) => { const o = ad.data() || {}; o.aid = ad.id; map[ad.id] = o; });
            window.snOnMyAnswers(map);
          } catch (e) {}
        }
      });
    } catch (e) {
      if (window.snOnAuthChange) window.snOnAuthChange(null, false, false);
    }
  }
</script>
<script>
// Loading splash: play the animation, then fade out and remove.
(function(){
  var sp = document.getElementById('splash');
  if(!sp) return;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var MIN = reduce ? 400 : 2000;
  var start = Date.now();
  var done = false;
  function hide(){
    if(done) return; done = true;
    sp.classList.add('sp-hide');
    setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); }, 650);
  }
  window.addEventListener('load', function(){
    setTimeout(hide, Math.max(0, MIN - (Date.now() - start)));
  });
  setTimeout(hide, MIN + 900); // fallback in case 'load' already fired
})();
</script>
</body>
