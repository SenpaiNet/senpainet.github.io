<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>相談一覧 | SenpaiNet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@600&amp;family=Noto+Sans+JP:wght@400;700&amp;family=Zen+Kaku+Gothic+New:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff;color:#142b54;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;line-break:strict}
h1,h2,h3,h4{font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;font-feature-settings:"palt";word-break:auto-phrase}
a{color:#2370f1}a:hover{color:#1a56c9}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #2370f1;outline-offset:2px}
button{font-family:inherit;cursor:pointer}
.q-card:hover{box-shadow:0 4px 14px rgba(0,40,90,0.14)}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh; background: #f6f6f6; box-sizing: border-box">

<header style="border-bottom: 1px solid #e3e8ef; background: #ffffff">
<div style="max-width: 1120px; margin: 0 auto; padding: 16px clamp(24px, 4vw, 48px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none" aria-label="SenpaiNet トップへ">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2370f1" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.42 10.92a1 1 0 0 0-.02-1.84L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.83l8.57 3.91a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg>
<span style="font-family: Lexend, sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 0.01em"><span style="color: #142b54">Senpai</span><span style="color: #2370f1">Net</span></span>
</a>
<nav aria-label="メインメニュー" style="display: flex; flex-wrap: wrap; align-items: center; gap: 24px; font-size: 14px; font-weight: 700">
<a href="Board.dc.html" aria-current="page" style="color: #2370f1; text-decoration: none">相談一覧</a>
<a href="Main.dc.html#flow" style="color: #142b54; text-decoration: none">使い方</a>
<a href="Onboarding.dc.html" style="display: inline-flex; align-items: center; gap: 8px; color: #142b54; text-decoration: none; padding: 10px 16px; border-radius: 9999px; background: #e8f1fe">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>マイページ</a>
</nav>
</div>
</header>

<main style="max-width: 1120px; margin: 0 auto; padding: 48px clamp(24px, 4vw, 48px) 96px; display: flex; flex-direction: column; gap: 32px">

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: #2370f1">相談一覧</p>
<h1 style="margin: 0; font-family: Lexend, sans-serif; font-size: clamp(48px, 6vw, 72px); line-height: 1; font-weight: 600; letter-spacing: 0.01em; color: #2370f1">Board</h1>
</div>
<a href="NewQuestion.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 52px; box-sizing: border-box; padding: 0 28px; border-radius: 9999px; background: #cc3f35; color: #ffffff; font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>先輩に相談する</a>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
<label for="search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">相談を検索</label>
<div style="flex: 1 1 320px; display: flex; align-items: center; gap: 10px; min-height: 48px; box-sizing: border-box; padding: 0 16px; background: #ffffff; border: 1px solid #e3e8ef; border-radius: 9999px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5b6573" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
<input id="search" type="search" placeholder="キーワードで相談を探す" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: #142b54">
</div>
<div role="group" aria-label="並び替え" style="display: flex; gap: 4px; padding: 4px; background: #ffffff; border: 1px solid #e3e8ef; border-radius: 9999px">
<sc-for list="{{ sorts }}" as="s" hint-placeholder-count="3">
<button type="button" onClick="{{ s.pick }}" aria-pressed="{{ s.pressed }}" style="{{ s.style }}">{{ s.label }}</button>
</sc-for>
</div>
<button type="button" onClick="{{ toggleUnanswered }}" aria-pressed="{{ unansweredPressed }}" style="{{ unansweredStyle }}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>未回答だけ</button>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">

<aside style="flex: 1 1 220px; max-width: 100%; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 15px; line-height: 24px; font-weight: 700">カテゴリ</h2>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ cats }}" as="c" hint-placeholder-count="13">
<li><button type="button" onClick="{{ c.pick }}" aria-pressed="{{ c.pressed }}" style="{{ c.style }}">{{ c.label }}</button></li>
</sc-for>
</ul>
</aside>

<section aria-label="相談の一覧" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 13px; line-height: 22px; color: #5b6573">{{ countLabel }}</p>
<sc-for list="{{ visible }}" as="q" hint-placeholder-count="6">
<a class="q-card" href="Question.dc.html" style="background: #ffffff; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0, 40, 90, 0.08); display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #142b54; transition: box-shadow 200ms">
<span style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<sc-if value="{{ q.resolved }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #ffffff; background: #2370f1; border-radius: 9999px; padding: 3px 10px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>解決済み</span></sc-if>
<sc-for list="{{ q.tags }}" as="t" hint-placeholder-count="2"><span style="font-size: 12px; font-weight: 700; color: #1a56c9; background: #e8f1fe; border-radius: 9999px; padding: 3px 10px">#{{ t }}</span></sc-for>
</span>
<span style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 17px; line-height: 26px; font-weight: 700">{{ q.title }}</span>
<span style="font-size: 13px; line-height: 22px; color: #5b6573; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{ q.excerpt }}</span>
<span style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding-top: 10px; border-top: 1px solid #e3e8ef; font-size: 12px; line-height: 18px; color: #5b6573">
<span>{{ q.who }} ・ {{ q.date }}</span>
<span style="display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: {{ q.countColor }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>{{ q.answerLabel }}</span>
</span>
</a>
</sc-for>
<sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
<div style="background: #ffffff; border-radius: 8px; padding: 48px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px">
<p style="margin: 0; font-size: 15px; line-height: 28px">この条件に合う相談はまだありません。</p>
<a href="NewQuestion.dc.html" style="font-size: 14px; font-weight: 700; color: #1a56c9">最初に相談してみる</a>
</div>
</sc-if>
</section>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { cat: 'すべて', sort: 'new', unanswered: false };
}
renderVals() {
var self = this;
var st = this.state;
var data = [
{ tags: ['文理選択','受験・進路'], title: '理系か文系か、まだ決められません', excerpt: '数学は好きだけど得意ではなく、社会科目にも興味があります。先輩たちはどうやって決めましたか。決めた時期も知りたいです。', who: '在校生・4年・運動部', date: '11月22日', answers: 5, resolved: false, order: 1 },
{ tags: ['留学・国際'], title: '高校で1年留学すると受験は不利になりますか', excerpt: '5年生の夏から1年間の留学を考えています。帰国後の受験勉強が間に合うか心配です。', who: '在校生・3年・文化部', date: '11月21日', answers: 3, resolved: false, order: 2 },
{ tags: ['部活動','学校生活'], title: '部活と勉強の両立、何年生まで続けましたか', excerpt: '引退の時期で迷っています。6年生まで続けた先輩の話を聞きたいです。', who: '匿名・在校生', date: '11月21日', answers: 0, resolved: false, order: 3 },
{ tags: ['大学生活'], title: '大学1年の授業はどれくらい忙しいですか', excerpt: 'サークルやアルバイトとの両立について、理系と文系の先輩それぞれに聞いてみたいです。', who: '在校生・6年・文系', date: '11月20日', answers: 7, resolved: true, order: 4 },
{ tags: ['IB・課題研究'], title: '課題研究のテーマが決まりません', excerpt: '興味のある分野が広すぎて絞れません。テーマをどう決めたか教えてください。', who: '在校生・5年・理系', date: '11月19日', answers: 4, resolved: true, order: 5 },
{ tags: ['資格・検定','授業・勉強'], title: '英検準1級はいつまでに取るのがいいですか', excerpt: '受験で使えるか、いつ頃から対策を始めたか知りたいです。', who: '在校生・3年・運動部', date: '11月18日', answers: 2, resolved: false, order: 6 },
{ tags: ['人間関係'], title: 'クラス替えのあと、なかなか話せる人ができません', excerpt: '前のクラスの友達とは仲が良いのですが、新しいクラスで居場所がない感じがします。', who: '匿名・在校生', date: '11月17日', answers: 0, resolved: false, order: 7 },
{ tags: ['就活・キャリア'], title: '大学の学部選びで、将来の仕事はどこまで考えましたか', excerpt: 'やりたい仕事がまだはっきりしていません。学部を決めたときの考え方を教えてください。', who: '在校生・6年・文系', date: '11月16日', answers: 6, resolved: true, order: 8 }
];
var catNames = ['すべて','受験・進路','大学生活','部活動','授業・勉強','文理選択','留学・国際','資格・検定','人間関係','学校生活','就活・キャリア','IB・課題研究','その他'];
var chipBase = 'min-height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 9999px; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; ';
var cats = catNames.map(function (n) {
var on = st.cat === n;
return {
label: n === 'すべて' ? n : '#' + n,
pressed: on ? 'true' : 'false',
style: chipBase + (on ? 'border: 1px solid #2370f1; background: #2370f1; color: #ffffff' : 'border: 1px solid #e3e8ef; background: #ffffff; color: #1a56c9'),
pick: function () { self.setState({ cat: n }); }
};
});
var sortDefs = [{ id: 'new', label: '新着' }, { id: 'many', label: '回答が多い' }, { id: 'open', label: '未解決' }];
var sorts = sortDefs.map(function (s) {
var on = st.sort === s.id;
return {
label: s.label,
pressed: on ? 'true' : 'false',
style: 'min-height: 40px; padding: 0 16px; border: 0; border-radius: 9999px; font-size: 14px; font-weight: 700; ' + (on ? 'background: #2370f1; color: #ffffff' : 'background: transparent; color: #142b54'),
pick: function () { self.setState({ sort: s.id }); }
};
});
var list = data.filter(function (q) {
if (st.cat !== 'すべて' && q.tags.indexOf(st.cat) < 0) return false;
if (st.unanswered && q.answers > 0) return false;
if (st.sort === 'open' && q.resolved) return false;
return true;
});
if (st.sort === 'many') list = list.slice().sort(function (a, b) { return b.answers - a.answers; });
var visible = list.map(function (q) {
return Object.assign({}, q, {
answerLabel: q.answers === 0 ? '回答待ち' : '回答 ' + q.answers + '件',
countColor: q.answers === 0 ? '#cc3f35' : '#1a56c9'
});
});
return {
cats: cats,
sorts: sorts,
visible: visible,
empty: visible.length === 0,
countLabel: visible.length + '件の相談',
unansweredPressed: st.unanswered ? 'true' : 'false',
unansweredStyle: 'display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 18px; border-radius: 9999px; font-size: 14px; font-weight: 700; ' + (st.unanswered ? 'border: 1px solid #2370f1; background: #e8f1fe; color: #1a56c9' : 'border: 1px solid #e3e8ef; background: #ffffff; color: #142b54'),
toggleUnanswered: function () { self.setState({ unanswered: !st.unanswered }); }
};
}
}
</script>
</body>
</html>
